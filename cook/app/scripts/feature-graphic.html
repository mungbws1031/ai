<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>전자혀 피처 그래픽</title>
<!-- 구글 플레이 피처 그래픽 원본 (1024×500). 렌더: node scripts/feature-graphic.mjs -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --cream:#FFFCF6; --bg:#F4EEE3; --ink:#2B2118; --muted:#7A6A58;
    --orange:#F2722B; --orange-2:#FFB26A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1024px;height:500px;overflow:hidden;background:var(--bg)}
  body{font-family:"Noto Sans KR",sans-serif;color:var(--ink)}
  .card{position:relative;width:1024px;height:500px;overflow:hidden;
    background:radial-gradient(120% 140% at 0% 0%, var(--cream) 0%, var(--bg) 70%)}
  /* 오른쪽 주황 면 */
  .panel{position:absolute;right:-120px;top:-80px;width:600px;height:680px;border-radius:120px;
    transform:rotate(-12deg);background:linear-gradient(140deg,var(--orange-2) 0%,var(--orange) 75%)}
  /* 왼쪽 글 */
  .copy{position:absolute;left:72px;top:0;bottom:0;width:470px;display:flex;flex-direction:column;justify-content:center;gap:18px}
  .brand{display:flex;align-items:center;gap:14px}
  .brand img{width:58px;height:58px;border-radius:15px;box-shadow:0 6px 16px rgba(242,114,43,.35)}
  .brand b{font-size:30px;font-weight:900;letter-spacing:-.5px}
  .brand span{display:block;font-size:14px;font-weight:500;color:var(--muted);margin-top:2px}
  h1{font-size:46px;line-height:1.22;font-weight:900;letter-spacing:-1.5px}
  h1 em{font-style:normal;color:var(--orange)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chips span{font-size:16px;font-weight:700;padding:7px 14px;border-radius:999px;background:#fff;
    border:1.5px solid #EADFCF;color:var(--ink)}
  /* 오른쪽 휴대폰 */
  .phone{position:absolute;right:96px;top:46px;width:236px;height:470px;border-radius:34px;background:#1d1712;
    padding:9px;transform:rotate(4deg);box-shadow:0 24px 50px rgba(80,40,10,.35)}
  .phone .screen{width:100%;height:100%;border-radius:26px;overflow:hidden;background:var(--cream)}
  .phone img{width:100%;display:block}
  .phone.back{right:282px;top:96px;transform:rotate(-7deg);width:206px;height:410px;opacity:.97}
</style>
</head>
<body>
  <div class="card">
    <div class="panel"></div>
    <div class="copy">
      <div class="brand">
        <img src="../../icon-512.png" alt="" />
        <div><b>전자혀</b><span>요리 초보를 위한 맛 계산기</span></div>
      </div>
      <h1>땡기는 맛 고르면<br/><em>살 재료</em>가 나와요</h1>
      <div class="chips"><span>🧅 파기름맛</span><span>🌶️ 맵달</span><span>🧒 초딩입맛</span></div>
    </div>
    <div class="phone back"><div class="screen"><img src="../store/1-gamseong.png" alt="" /></div></div>
    <div class="phone"><div class="screen"><img src="../store/3-cart.png" alt="" /></div></div>
  </div>
</body>
</html>
