<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>챙겨줘 트립</title>
<meta name="description" content="나라·코스·가족만 고르면 준비물, 일정, 맛집, D-day 할 일까지 짜주고 끝낼 때까지 알려주는 아이 동반 여행 플래너">
<meta name="theme-color" content="#15233F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --sky: #E9EEF4;      /* 배경 — 공항 대합실 유리 */
  --paper: #FFFFFF;
  --ink: #15233F;      /* 남색 잉크 · 보드 */
  --sign: #FFC629;     /* 공항 안내판 노랑 */
  --alert: #D6343F;    /* 되돌릴 수 없는 일 */
  --ok: #1F8A5B;
  --muted: #5C6B82;
  --line: #D3DBE6;
  --board-text: #FFC629;
  --radius-s: 6px;
  --radius-l: 14px;
  --sans: 'IBM Plex Sans KR', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --sky: #0F1A2E; --paper: #172540; --ink: #E7ECF4; --muted: #9AA8BE; --line: #2A3B5C;
    --alert: #FF6B74; --ok: #4CC38A; color-scheme: dark;
  }
  .board { background: #0A1222 !important; }
  .btn.primary { color: #15233F; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--sky); color: var(--ink); font: 400 16px/1.6 var(--sans); }
#app { max-width: 560px; margin: 0 auto; padding: 0 16px calc(96px + env(safe-area-inset-bottom)); }
a { color: inherit; }
h1, h2, h3 { line-height: 1.3; margin: 0; }
h1 { font-size: 1.125rem; font-weight: 700; }
h2 { font-size: 1.0625rem; font-weight: 700; }
p { margin: 0; }
:focus-visible { outline: 3px solid var(--sign); outline-offset: 2px; border-radius: 4px; }

/* 상단 */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 0 14px; }
.top.sub { justify-content: flex-start; }
.icon-link { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; text-decoration: none; font-size: 1.15rem; }
.icon-link:hover { background: var(--paper); }

/* 출발 안내판 — 이 앱의 단 하나의 큰 장면 */
.board { background: #15233F; color: #E7ECF4; border-radius: var(--radius-l); padding: 16px; display: flex; gap: 16px; align-items: center; }
.board-link { text-decoration: none; display: block; margin-bottom: 8px; }
.board.big { flex-direction: column; align-items: flex-start; padding: 22px 20px; }
.flaps { display: flex; gap: 4px; }
.flap { position: relative; display: inline-grid; place-items: center; min-width: 1.15em; height: 1.5em; padding: 0 .08em;
  background: #22335A; color: var(--board-text); font: 700 2rem/1 var(--mono); border-radius: 5px;
  box-shadow: inset 0 -1px 0 rgba(0,0,0,.35); }
.board.flip .flap { animation: flip .5s cubic-bezier(.3,.7,.4,1) both; animation-delay: calc(var(--i) * 70ms); }
.flap::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(0,0,0,.45); }
.board.big .flap { font-size: 3.4rem; }
@keyframes flip { from { transform: rotateX(90deg); opacity: .2; } to { transform: none; opacity: 1; } }
.board:not(.big) .flap { font-size: 1.6rem; }
.board-meta { display: grid; gap: 2px; font-size: .875rem; color: #B8C3D6; }
.board-meta strong { color: #fff; font-size: 1rem; }
.route { font-family: var(--mono); color: #fff; letter-spacing: .04em; }
.route b { color: var(--board-text); }

/* 섹션 */
section { margin-top: 28px; }
section > h2 { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
.count { font: 700 .8125rem/1 var(--mono); background: var(--ink); color: var(--paper); border-radius: 99px; padding: 4px 8px; }
.lead { color: var(--muted); margin-bottom: 14px; }
.note { color: var(--muted); font-size: .875rem; margin: 8px 0; }
.calm { color: var(--muted); padding: 18px; background: var(--paper); border-radius: var(--radius-l); }
.more { color: var(--muted); font-size: .875rem; margin-top: 10px; }
.empty { text-align: left; display: grid; gap: 16px; margin-top: 12px; }
.empty h2 { font-size: 1.5rem; }
.empty .demo { animation: none; }

/* 버튼 */
.btn { appearance: none; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); font: 500 1rem/1 var(--sans);
  padding: 13px 18px; border-radius: 99px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; }
.btn.primary { background: var(--sign); border-color: var(--sign); color: #15233F; font-weight: 700; }
.btn.ghost { border-color: var(--line); }
.btn.small { min-height: 36px; padding: 8px 14px; font-size: .875rem; }
.btn.wide { width: 100%; margin-top: 14px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

/* 할 일 목록 — 카드가 아니라 하나의 체크 목록 */
.tasks { list-style: none; margin: 0; padding: 0; background: var(--paper); border-radius: var(--radius-l); overflow: hidden; }
.task { border-left: 4px solid transparent; }
.task + .task { border-top: 1px solid var(--line); }
.task.red { border-left-color: var(--alert); }
.task.late .t-when { color: var(--alert); font-weight: 500; }
.task.done .t-title { text-decoration: line-through; color: var(--muted); }
.check { display: flex; gap: 12px; align-items: flex-start; padding: 14px 14px 14px 12px; cursor: pointer; }
.check input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.box { flex: none; width: 26px; height: 26px; border: 2px solid var(--muted); border-radius: 7px; margin-top: 1px; display: grid; place-items: center; transition: background .15s; }
.check input:checked + .box { background: var(--ok); border-color: var(--ok); }
.check input:checked + .box::after { content: ''; width: 7px; height: 13px; border: solid #fff; border-width: 0 3px 3px 0; transform: translateY(-2px) rotate(45deg); }
.check input:focus-visible + .box { outline: 3px solid var(--sign); outline-offset: 2px; }
.t-body { display: grid; gap: 2px; }
.t-title { font-weight: 500; }
.t-when { font-size: .8125rem; color: var(--muted); }
.t-more { padding: 0 14px 14px 50px; }
.t-more summary { font-size: .8125rem; color: var(--muted); cursor: pointer; }
.t-more p { font-size: .875rem; margin: 8px 0; }
.t-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
.owner { font-size: .8125rem; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.owner select { font: inherit; padding: 6px; border-radius: var(--radius-s); border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
.t-sec { margin-top: 22px; }
details.t-sec > summary { color: var(--muted); cursor: pointer; padding: 6px 0; }
details.t-sec .tasks { margin-top: 8px; }

.progress { position: relative; height: 32px; background: var(--paper); border-radius: 99px; overflow: hidden; margin-top: 18px; }
.progress span { position: absolute; inset: 0 auto 0 0; background: var(--sign); border-radius: 99px; transition: width .3s; }
.progress em { position: relative; display: block; text-align: center; font: 500 .8125rem/32px var(--sans); font-style: normal; color: #15233F; }
@media (prefers-color-scheme: dark) { .progress em { color: var(--ink); } }

.banner { display: flex; align-items: center; gap: 12px; justify-content: space-between; background: var(--paper); border: 1.5px dashed var(--sign); border-radius: var(--radius-l); padding: 12px 14px; margin-top: 14px; font-size: .875rem; }

/* 내 여행 */
.trip-list { list-style: none; padding: 0; margin: 0; background: var(--paper); border-radius: var(--radius-l); }
.trip-list li + li { border-top: 1px solid var(--line); }
.trip-list a { display: flex; gap: 14px; align-items: center; padding: 14px; text-decoration: none; }
.tl-d { font: 700 1rem/1 var(--mono); color: var(--ink); min-width: 64px; }
.tl-main { display: grid; }
.tl-main span { font-size: .8125rem; color: var(--muted); }
.past summary { color: var(--muted); cursor: pointer; margin-top: 12px; }

/* 마법사 */
.steps { display: flex; list-style: none; padding: 0; margin: 0 0 8px; gap: 4px; }
.steps li { flex: 1; text-align: center; font-size: .75rem; color: var(--muted); padding-top: 8px; border-top: 3px solid var(--line); }
.steps li.past { border-color: var(--ink); }
.steps li.on { border-color: var(--sign); color: var(--ink); font-weight: 700; }
.q { font-size: 1.375rem; margin: 18px 0 12px; }
.region { font-size: .875rem; color: var(--muted); margin: 18px 0 8px; font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { appearance: none; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 99px; padding: 10px 16px; font: 500 1rem/1.2 var(--sans); cursor: pointer; display: inline-flex; gap: 6px; align-items: baseline; min-height: 44px; }
.chip small { color: var(--muted); font-size: .75rem; }
.chip.on { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.chip.on small { color: inherit; }
.courses { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.course { appearance: none; width: 100%; text-align: left; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); border-radius: var(--radius-l); padding: 16px; font: inherit; cursor: pointer; display: grid; gap: 6px; }
.course.on, .course:hover { border-color: var(--ink); }
.course strong { font-size: 1.0625rem; }
.c-meta { font-size: .8125rem; color: var(--muted); }
.c-days { font-size: .875rem; }
.c-tip { font-size: .8125rem; color: var(--muted); border-left: 3px solid var(--sign); padding-left: 8px; }
.wiz-foot { position: fixed; left: 0; right: 0; bottom: 0; background: var(--sky); border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); display: flex; justify-content: space-between; gap: 12px; max-width: 560px; margin: 0 auto; }
.wiz-foot .btn.primary { flex: 1; }
.summary { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 8px; }
.summary li { background: var(--paper); padding: 12px 14px; border-radius: var(--radius-s); }
.summary li.warn { border-left: 4px solid var(--alert); }

/* 폼 */
.form { display: grid; gap: 14px; }
.form label { display: grid; gap: 6px; font-weight: 500; font-size: .9375rem; }
.form input:not([type=checkbox]):not([type=radio]), .form select, .form textarea {
  font: 400 1rem/1.4 var(--sans); padding: 12px; border: 1.5px solid var(--line); border-radius: var(--radius-s); background: var(--paper); color: var(--ink); width: 100%; }
.form textarea { resize: vertical; }
.hint { font-weight: 400; color: var(--muted); font-size: .8125rem; }
fieldset { border: 1.5px solid var(--line); border-radius: var(--radius-l); padding: 16px; margin: 18px 0 0; display: grid; gap: 14px; background: var(--paper); }
legend { font-weight: 700; padding: 0 6px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tags, .seg, .filter { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { position: relative; display: inline-flex !important; cursor: pointer; }
.tag input { position: absolute; opacity: 0; }
.tag span { border: 1.5px solid var(--line); border-radius: 99px; padding: 7px 12px; font-size: .875rem; font-weight: 400; background: var(--paper); display: inline-grid; }
.tag span small { color: var(--muted); font-size: .75rem; }
.tag input:checked + span { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.tag input:checked + span small { color: inherit; }
.tag input:focus-visible + span { outline: 3px solid var(--sign); outline-offset: 2px; }
.tag.inline span { border: none; padding: 0; background: none; }
.tag.inline input:checked + span { background: none; color: var(--ink); }
.tag.inline input { position: static; opacity: 1; margin-right: 8px; width: 18px; height: 18px; }
.stepper { display: flex; align-items: center; gap: 12px; }
.stepper output { font: 700 1.125rem/1 var(--mono); min-width: 8ch; text-align: center; }
.members { list-style: none; padding: 0; margin: 0; background: var(--paper); border-radius: var(--radius-l); }
.members li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px; }
.members li + li { border-top: 1px solid var(--line); }
.members li > span { display: grid; }
.members small { color: var(--muted); font-size: .8125rem; }

/* 여행 탭 */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; background: var(--paper); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); max-width: 560px; margin: 0 auto; }
.tabs a { flex: 1; text-align: center; padding: 14px 0; text-decoration: none; font-weight: 500; color: var(--muted); border-top: 3px solid transparent; margin-top: -1px; }
.tabs a[aria-current=page] { color: var(--ink); border-top-color: var(--sign); font-weight: 700; }
.trip-body > section:first-child, .trip-body > .progress:first-child { margin-top: 18px; }
.info dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; background: var(--paper); padding: 14px; border-radius: var(--radius-l); font-size: .9375rem; }
.info dt { color: var(--muted); }
.info dd { margin: 0; }

/* 일정 */
.filter { align-items: center; margin-top: 18px; }
.filter > span { font-size: .875rem; color: var(--muted); margin-right: 4px; }
.days { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 20px; }
.day { background: var(--paper); border-radius: var(--radius-l); padding: 18px 16px; }
.day header { display: grid; gap: 2px; margin-bottom: 10px; }
.d-no { font: 700 .8125rem/1 var(--mono); color: var(--muted); }
.d-date { font-size: .8125rem; color: var(--muted); }
.spots { list-style: none; padding: 0; margin: 0; border-left: 2px dashed var(--line); margin-left: 6px; }
.spot { position: relative; padding: 0 0 14px 18px; }
.spot::before { content: ''; position: absolute; left: -7px; top: 30px; width: 12px; height: 12px; border-radius: 50%; background: var(--paper); border: 3px solid var(--ink); }
.leg { font-size: .8125rem; color: var(--muted); padding: 2px 0 6px; }
.leg a { color: var(--ink); font-weight: 500; margin-left: 4px; }
.sp-main { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sp-name { font-weight: 700; text-decoration: none; }
.sp-name:hover { text-decoration: underline; }
.badge { font-size: .75rem; border: 1px solid var(--line); border-radius: 99px; padding: 2px 8px; color: var(--muted); }
.badge.kid { border-color: var(--sign); color: var(--ink); background: color-mix(in srgb, var(--sign) 22%, transparent); }
.badge.book { border-color: var(--ink); color: var(--ink); }
.warn { font-size: .8125rem; color: var(--alert); margin-top: 4px; }
.food { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 12px; }
.food h3 { font-size: .875rem; margin-bottom: 6px; }
.food ul { margin: 0; padding-left: 18px; }
.food li { margin: 2px 0; }
.food small { color: var(--alert); }
.more-link { display: inline-block; margin-top: 8px; font-size: .875rem; font-weight: 500; }

/* 준비물 */
.door { background: var(--ink); color: var(--paper); border-radius: var(--radius-l); padding: 16px; }
@media (prefers-color-scheme: dark) { .door { background: #0A1222; color: #E7ECF4; } }
.door h2 { margin-bottom: 12px; }
.door-row { display: flex; flex-wrap: wrap; gap: 8px; }
.door-item { position: relative; cursor: pointer; }
.door-item input { position: absolute; opacity: 0; }
.door-item span { display: inline-block; border: 1.5px solid rgba(255,255,255,.35); border-radius: 99px; padding: 8px 14px; font-size: .9375rem; }
.door-item.on span { background: var(--sign); border-color: var(--sign); color: #15233F; font-weight: 700; }
.door-item input:focus-visible + span { outline: 3px solid var(--sign); outline-offset: 2px; }
.pack ul { list-style: none; padding: 0; margin: 0; background: var(--paper); border-radius: var(--radius-l); }
.pack li + li { border-top: 1px solid var(--line); }
.pack .check { padding: 11px 14px; align-items: center; }
.pack input:checked ~ .t-title { color: var(--muted); text-decoration: line-through; }

.settings section { background: var(--paper); border-radius: var(--radius-l); padding: 16px; }
.settings .members { background: none; }
.settings .members li { padding: 10px 0; }
.danger { margin-top: 32px; }

.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #15233F; color: #fff; padding: 12px 18px; border-radius: 99px; font-size: .9375rem; z-index: 20; max-width: calc(100vw - 32px); text-align: center; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (min-width: 600px) { .board.big .flap { font-size: 4rem; } }
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<noscript>자바스크립트를 켜야 쓸 수 있어요.</noscript>
<script src="data.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
