name: Deploy apps to GitHub Pages

# Publishes standalone apps so they can be shared as links:
#   site/          -> https://<user>.github.io/<repo>/            (ticketing practice simulator)
#   scent-mixer/   -> https://<user>.github.io/<repo>/scent-mixer/ (Scent Mixer PWA)
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scent-mixer/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble publish directory
        run: |
          mkdir -p _site
          cp -r site/. _site/
          mkdir -p _site/scent-mixer
          cp -r scent-mixer/. _site/scent-mixer/
          rm -f _site/scent-mixer/gen_icons.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
