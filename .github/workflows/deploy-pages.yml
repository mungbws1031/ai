name: Deploy Wiki Preview to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/lfa-tester-stick-wiki-A0lkJ
    paths:
      - 'lfa_tester_wiki_preview.html'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site directory
        run: |
          set -euo pipefail
          mkdir -p _site
          cp lfa_tester_wiki_preview.html _site/index.html
          cp lfa_tester_wiki_preview.html _site/lfa_tester_wiki_preview.html
          echo "Site contents:"
          ls -la _site

      - name: Configure Pages (auto-enable if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
