name: Deploy apps to GitHub Pages

# Publishes standalone apps so they can be shared from one Pages site:
#   site/              -> https://<user>.github.io/<repo>/             (ticketing practice simulator)
#   eddie/             -> https://<user>.github.io/<repo>/eddie/       ("에디의 하루" app)
#   scent-mixer/       -> https://<user>.github.io/<repo>/scent-mixer/ (Scent Mixer PWA)
#   tina/              -> https://<user>.github.io/<repo>/tina/        (티나 정리 임팩트 PWA)
#   miri/              -> https://<user>.github.io/<repo>/miri/        (미리 스케줄 PWA)
#   cook/              -> https://<user>.github.io/<repo>/cook/        (셰프 미강 TASTE ENGINE)
#   nfc-tag-review-guide/ -> https://<user>.github.io/<repo>/nfc/     (NFC 태그 리뷰 가이드)
#   land-price/        -> https://<user>.github.io/<repo>/land-price/  (초강리 땅값; phone.html = 휴대폰·큰 글씨)
#   gulza/             -> https://<user>.github.io/<repo>/gulza/       (GULZA 모션 자막 제작기)
#   atomciv/           -> https://<user>.github.io/<repo>/atomciv/     (원자에서 문명까지 — 초등 과학 게임)
#   parking-game/      -> https://<user>.github.io/<repo>/parking-game/ (잠깐 세워도 될까 — 주차 판단 연습)
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "eddie/**"
      - "scent-mixer/**"
      - "tina/**"
      - "miri/**"
      - "cook/**"
      - "nfc-tag-review-guide/**"
      - "land-price/index.html"
      - "land-price/phone.html"
      - "gulza/**"
      - "atomciv/**"
      - "parking-game/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment. Queue newer runs instead of cancelling an
# in-progress one: a deploy cancelled mid-way can also cancel the next run's
# deployment of the same commit ("Deployment cancelled").
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: eddie/package-lock.json

      - name: Build Eddie's Day (static export)
        working-directory: eddie
        env:
          GITHUB_PAGES: "true"
        run: |
          npm ci
          npm run build

      - name: Build 미리 (Vite PWA)
        working-directory: miri
        run: |
          npm ci
          npm run build

      - name: Assemble Pages site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -r site/. _site/
          mkdir -p _site/eddie
          cp -r eddie/out/. _site/eddie/
          mkdir -p _site/scent-mixer
          cp -r scent-mixer/. _site/scent-mixer/
          rm -f _site/scent-mixer/gen_icons.py
          mkdir -p _site/tina
          cp -r tina/. _site/tina/
          rm -f _site/tina/gen_icons.py
          mkdir -p _site/miri
          cp -r miri/dist/. _site/miri/
          mkdir -p _site/cook
          cp -r cook/. _site/cook/
          mkdir -p _site/nfc
          cp -r nfc-tag-review-guide/. _site/nfc/
          mkdir -p _site/land-price
          cp land-price/index.html land-price/phone.html _site/land-price/
          mkdir -p _site/gulza
          cp -r gulza/. _site/gulza/
          rm -rf _site/gulza/dev _site/gulza/tools
          find _site/gulza -name '*.py' -delete
          mkdir -p _site/atomciv
          cp -r atomciv/. _site/atomciv/
          rm -rf _site/atomciv/tests
          mkdir -p _site/parking-game
          cp parking-game/*.html parking-game/*.js _site/parking-game/
          rm -f _site/parking-game/test-*.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Deploy in a separate job so the uploaded artifact is fully registered
  # before deploy-pages fetches it (fixes intermittent "Found 0 artifacts").
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
