<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>원자에서 문명까지</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#fff7e8; --ink:#2d2a32; --top:#ffd98a; --drawer:#fff0d0; --accent:#ff8c42;
  --card:#ffffff; --muted:#8a8494; --ok:#3fb26b; --shadow:0 3px 0 rgba(0,0,0,.15);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
button{font:inherit;color:inherit;min-height:56px;min-width:56px;border:0;border-radius:16px;background:#fff;
  box-shadow:var(--shadow);font-size:18px;font-weight:700;cursor:pointer;padding:0 14px}
button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
button:disabled{opacity:.4}
[hidden]{display:none!important}
#app{display:grid;grid-template-rows:auto 1fr;height:100vh;height:100dvh}
#top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--top)}
#era-badge{font-weight:800;font-size:18px;white-space:nowrap}
#tabs{display:flex;gap:6px;margin:0 auto}
#tabs button{padding:0 12px}
#tabs button[aria-current=true]{background:var(--accent);color:#fff}
#stage{position:relative;display:grid;grid-template-columns:250px 1fr;min-height:0}
#drawer{overflow-y:auto;padding:10px;background:var(--drawer);min-height:0}
#drawer h3{margin:6px 2px 8px;font-size:16px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.atom-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;min-width:64px;font-size:13px}
.atom-btn .ball{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:800;border:3px solid #333}
.glow{animation:glow 1s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 0 0 #ffd23f}to{box-shadow:0 0 0 8px #ffd23f}}
#bench-wrap{position:relative;min-height:0;overflow:hidden}
#village,#bench{position:absolute;inset:0;width:100%;height:100%}
#village{pointer-events:none}
#bench{touch-action:none}
#bench .atom{cursor:grab}
#bench .atom .body{transform-box:fill-box;transform-origin:center}
#bench .atom.needy .body{animation:wiggle .5s ease-in-out infinite alternate}
#bench .atom.done .body{animation:pop .6s ease-out forwards}
@keyframes wiggle{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.25)}100%{transform:scale(1.1)}}
@media (prefers-reduced-motion:reduce){#bench .atom .body,.glow{animation:none!important}}
#bottom-bar{position:absolute;left:12px;right:12px;bottom:12px;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px;pointer-events:none}
#bottom-bar > *{pointer-events:auto}
#bench-tools{justify-self:start}
#mix{display:flex;align-items:center;gap:8px;justify-self:start}
#bottom-bar{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}
#mixer{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:1;max-width:calc(100% - 24px)}
#mixer #mix{justify-self:auto}
#tray.empty{min-height:56px;min-width:0;padding:6px 16px;flex-wrap:nowrap}
@media (max-width:600px){#hint-btn .t{display:none}#hint-btn{padding:0 10px}#mission-bar{font-size:15px;padding-left:12px}#tray{min-width:0}#tray-empty{font-size:13px}}
.item-chip{touch-action:none}
.drag-ghost{position:fixed;z-index:30;pointer-events:none;font-size:44px;transform:translate(-50%,-50%) scale(1.1);filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
#tray.drop-ready{background:#fff6d6;border-color:#ff8c42}
#toast{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);background:#2d2a32;color:#fff;
  padding:10px 16px;border-radius:14px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
#panel{position:absolute;inset:0;z-index:5;background:var(--bg);overflow-y:auto;padding:16px}
#panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
#panel-head h2{margin:0}
.dex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:18px}
.dex-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:110px;
  border-radius:16px;background:#fff;box-shadow:var(--shadow);font-size:15px;padding:8px;text-align:center}
.dex-item .em{font-size:36px}
.dex-item.locked{background:#eee6d6;color:var(--muted);box-shadow:none}
#card{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:rgba(40,30,20,.45);padding:16px}
#card-box{background:var(--card);border-radius:24px;padding:24px;max-width:420px;width:100%;text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.25);animation:cardin .3s ease-out}
@keyframes cardin{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
#card-emoji{font-size:72px;line-height:1.1}
#card-tag{color:var(--accent);font-weight:800;margin-top:6px}
#card-name{font-size:28px;font-weight:800;margin:4px 0}
#card-formula{color:var(--muted);font-size:20px;font-weight:700}
#card-why{font-size:18px;line-height:1.5;margin:12px 0 18px;word-break:keep-all}
#card-why:before{content:"왜 그럴까? ";font-weight:800;color:var(--ok)}
#card-box.plain #card-why:before{content:none}
#card-ok{background:var(--ok);color:#fff;min-width:140px}
.item-chip{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;min-width:64px;font-size:13px}
.item-chip .em{font-size:28px;line-height:1.1}
#tray{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;padding:10px 14px;min-height:96px;min-width:240px;max-width:min(560px,100%);border-radius:30px 30px 70px 70px !important;
  background:rgba(255,255,255,.75);border:3px dashed #d4b47c;border-radius:20px}
#tray .tray-label{font-size:26px}
#tray-empty{color:var(--muted);font-weight:700;font-size:15px;white-space:nowrap}
#tray-items .item-chip.pop-in{animation:popin .45s ease-out}
@keyframes popin{0%{transform:translateY(-60px) scale(.4);opacity:0}100%{transform:none;opacity:1}}
#tray-items{display:flex;gap:6px;flex-wrap:wrap}
#tray.bounce{animation:bounce .4s}
@keyframes bounce{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#mission-bar{position:absolute;top:10px;left:12px;right:12px;margin:0 auto;width:fit-content;display:flex;align-items:center;gap:10px;
  background:#fff;border-radius:18px;padding:6px 6px 6px 16px;box-shadow:var(--shadow);font-weight:800;font-size:18px;
  max-width:calc(100% - 24px);z-index:2}
#mission-text{word-break:keep-all}
#hint-btn{background:#ffe066;flex:none}
#app[data-mode=lab] #mission-bar{display:none}
#map-info{font-size:18px;font-weight:800;margin:4px 0 2px}
#map-next{color:var(--muted);font-weight:700;margin-bottom:8px}
#map-svg{display:block;width:100%;max-width:820px;max-height:calc(100vh - 230px);max-height:calc(100dvh - 230px);margin:0 auto;touch-action:manipulation}
#map-svg .map-node{cursor:pointer}
#map-svg .map-node[data-lit=true] circle{filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.save-note{font-size:18px;margin:6px 0;word-break:keep-all}
.save-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.load-btn{display:inline-flex;align-items:center;min-height:56px;padding:0 14px;border-radius:16px;background:#fff;box-shadow:var(--shadow);font-size:18px;font-weight:700;cursor:pointer}
#load-file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
@media (orientation:portrait){
  #stage{grid-template-columns:1fr;grid-template-rows:1fr auto}
  #drawer{order:2;max-height:36vh}
}
@media (max-width:700px){#tabs button .t{display:none}#era-badge span{display:none}}

/* ===== 테마: 모눈종이 실험 노트 + 주기율표 ===== */
:root{--bg:#f4f7fb;--ink:#18233d;--muted:#5b6782;--line:#d6dfea;--grid:#e3eaf3;--cobalt:#2d5be3;--sun:#ffc53d;--mint:#16a673;--coral:#f0564a;
  --top:#ffffff;--drawer:#ffffff;--accent:var(--cobalt);--ok:var(--mint);--card:#fff;--shadow:0 1px 0 var(--line)}
html,body{font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);background:var(--bg)}
button{border:1.5px solid var(--line);border-radius:14px;box-shadow:0 2px 0 var(--line);font-weight:600;background:#fff}
button:active{transform:translateY(2px);box-shadow:none}
button:focus-visible,.load-btn:focus-within{outline:3px solid var(--cobalt);outline-offset:2px}
#top{background:#fff;border-bottom:1.5px solid var(--line)}
#era-badge{font-weight:700;letter-spacing:-.01em}
#tabs{background:var(--bg);border:1.5px solid var(--line);border-radius:16px;padding:4px;gap:4px}
#tabs button{border-color:transparent;box-shadow:none;background:transparent;min-height:48px}
#tabs button[aria-current=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
#drawer{background:#fff;border-right:1.5px solid var(--line)}
#drawer h3{font-size:14px;font-weight:600;color:var(--muted);margin:10px 2px 8px}
/* 주기율표 칸 */
.atom-btn{position:relative;display:grid;grid-template-rows:auto 1fr auto;justify-items:center;width:64px;min-height:76px;padding:6px 4px 5px;
  border-radius:10px;border:1.5px solid var(--line);border-top:6px solid var(--el);box-shadow:0 2px 0 var(--line);gap:0}
.atom-btn .z{position:absolute;top:2px;left:6px;font:500 11px/1 "Space Grotesk",system-ui,sans-serif;color:var(--muted)}
.atom-btn .sym{font:700 24px/1.15 "Space Grotesk",system-ui,sans-serif;margin-top:6px;color:var(--ink)}
.atom-btn .nm{font-size:12px;font-weight:600;color:var(--ink)}
.atom-btn .hands{font-size:8px;letter-spacing:2px;color:var(--el);filter:saturate(1.2) brightness(.85)}
.item-chip{border-radius:12px;font-weight:600}
.item-chip .lbl{color:var(--ink)}
/* 모눈종이 실험대 */
#bench-wrap{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
#village{opacity:.55;filter:saturate(.8)}
#mission-bar{border:1.5px solid var(--line);box-shadow:0 2px 0 var(--line);border-radius:16px;font-weight:600}
#hint-btn{background:var(--sun);border-color:#e9ad1f;box-shadow:0 2px 0 #e9ad1f}
.glow{animation:glow2 1s ease-in-out infinite alternate}
@keyframes glow2{from{box-shadow:0 0 0 0 var(--sun)}to{box-shadow:0 0 0 6px var(--sun)}}
/* 섞는 그릇 */
#tray{background:#fff;border:2px dashed #b9c6d8}
#tray.drop-ready{background:#eef3ff;border-color:var(--cobalt);border-style:solid}
#tray-empty{color:var(--muted)}
#combine-btn:not(:disabled){background:var(--mint);border-color:#0f8a5f;box-shadow:0 2px 0 #0f8a5f;color:#fff}
#toast{background:var(--ink);border-radius:12px;font-weight:600;white-space:normal;max-width:calc(100% - 32px);text-align:center;word-break:keep-all}
/* 카드 */
#card{background:rgba(24,35,61,.5)}
#card-box{border-radius:20px;border:1.5px solid var(--line);box-shadow:0 18px 40px rgba(24,35,61,.25)}
#card-tag{color:var(--cobalt);font-weight:700}
#card-name{font-weight:700;letter-spacing:-.02em}
#card-formula{font-family:"Space Grotesk",system-ui,sans-serif;color:var(--muted)}
#card-why:before{color:var(--mint);font-weight:700}
#card-ok{background:var(--cobalt);border-color:#1f45b8;box-shadow:0 2px 0 #1f45b8;color:#fff}
/* 패널 (도감·지도·저장) */
#panel{background:var(--bg)}
#panel-head h2{font-weight:700;letter-spacing:-.02em}
.dex-item{border:1.5px solid var(--line);border-radius:14px;box-shadow:0 2px 0 var(--line);font-weight:600}
.dex-item.locked{background:transparent;border-style:dashed;box-shadow:none}
#map-info{font-weight:700}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div id="era-badge"><span id="era-emoji">🪨</span> <span id="era-name">석기시대</span></div>
    <nav id="tabs">
      <button data-tab="mission">🎯<span class="t"> 미션</span></button>
      <button data-tab="lab">🧪<span class="t"> 실험실</span></button>
      <button data-tab="dex">📖<span class="t"> 도감</span></button>
      <button data-tab="map">🗺️<span class="t"> 지도</span></button>
    </nav>
    <button id="save-menu" aria-label="저장 / 불러오기">💾</button>
    <button id="mute" aria-label="소리 켜기/끄기">🔊</button>
  </header>
  <main id="stage">
    <section id="drawer" aria-label="재료 서랍">
      <h3>원자</h3><div id="drawer-atoms" class="chips"></div>
      <div id="drawer-more"></div>
    </section>
    <section id="bench-wrap">
      <svg id="village" aria-hidden="true"></svg>
      <svg id="bench" aria-label="실험대"></svg>
      <div id="mission-bar"><span id="mission-text"></span><button id="hint-btn" aria-label="힌트">💡<span class="t"> 힌트</span></button></div>
      <div id="mixer">
        <div id="tray" aria-label="섞는 그릇"><span class="tray-label">🥣</span><span id="tray-empty">재료를 여기로 끌어와!</span><div id="tray-items"></div></div>
        <div id="mix">
          <button id="combine-btn" disabled>✨ 합치기</button>
        </div>
      </div>
      <div id="bottom-bar">
        <div id="bench-tools"><button id="clear-btn" aria-label="실험대 비우기">🧹</button></div>
      </div>
      <div id="toast" role="status"></div>
    </section>
    <div id="panel" hidden>
      <div id="panel-head"><h2 id="panel-title"></h2><button id="panel-close" aria-label="닫기">✖</button></div>
      <div id="panel-body"></div>
    </div>
  </main>
</div>
<div id="card" hidden>
  <div id="card-box" role="dialog" aria-modal="true">
    <div id="card-emoji"></div>
    <div id="card-tag"></div>
    <div id="card-name"></div>
    <div id="card-formula"></div>
    <div id="card-why"></div>
    <button id="card-ok">좋아!</button>
  </div>
</div>
<script>
'use strict';
/* ================= DATA ================= */
const ATOMS = {
  H:  { hands: 1, name: '수소',   color: '#cfe0ff', z: 1, trait: '가장 작고 가벼워' },
  O:  { hands: 2, name: '산소',   color: '#e5484d', z: 8, trait: '전자를 꽤 욕심내' },
  N:  { hands: 3, name: '질소',   color: '#3e63dd', z: 7, trait: '공기의 대부분이 나야' },
  C:  { hands: 4, name: '탄소',   color: '#3a4256', z: 6, trait: '손이 4개라 뭐든 만들어' },
  Cl: { hands: 1, name: '염소',   color: '#30a46c', z: 17, trait: '전자 욕심쟁이' },
  Na: { hands: 1, name: '나트륨', color: '#8e4ec6', z: 11, trait: '전자를 잘 줘 버려' },
  Si: { hands: 4, name: '규소',   color: '#c08532', z: 14, trait: '모래와 돌 속에 있어' },
  F:  { hands: 1, name: '플루오린', color: '#a6e3b0', z: 9, trait: '전자를 세상에서 제일 욕심내' },
  S:  { hands: 2, name: '황',     color: '#f5d742', z: 16, trait: '노랗고 화산 근처에 많아' },
  Mg: { hands: 2, name: '마그네슘', color: '#9aa7b8', z: 12, trait: '불에 타면 눈부시게 하얀 빛을 내' },
  K:  { hands: 1, name: '칼륨',   color: '#b38be0', z: 19, trait: '바나나 속에 많아' },
  Ca: { hands: 2, name: '칼슘',   color: '#5fb878', z: 20, trait: '뼈와 이를 튼튼하게 해' },
  P:  { hands: 3, name: '인',     color: '#ff8b3d', z: 15, trait: '성냥과 비료에 들어 있어' },
  I:  { hands: 1, name: '아이오딘', color: '#6b3fa0', z: 53, trait: '미역과 김에 많아' },
  He: { hands: 0, name: '헬륨',   color: '#bfefff', z: 2,  trait: '손이 없어도 혼자 완성!' },
  Ne: { hands: 0, name: '네온',   color: '#ff8a65', z: 10, trait: '손이 없어도 혼자 완성!' },
};

const MOLECULES = {
  H2:   { id: 'H2', formula: 'H₂',   name: '수소 기체',   emoji: '🎈', why: '수소 둘이 손을 잡았어. 수소는 우주에서 가장 흔한 원소야!' },
  O2:   { id: 'O2', formula: 'O₂',   name: '산소 기체',   emoji: '🌬️', why: '산소 둘이 두 손씩 꽉 잡았어. 우리가 숨 쉴 때 꼭 필요한 기체야!' },
  N2:   { id: 'N2', formula: 'N₂',   name: '질소 기체',   emoji: '☁️', why: '세 손을 다 잡아서 아주 튼튼해. 공기의 대부분이 이거야!' },
  H2O:  { id: 'H2O', formula: 'H₂O',  name: '물',         emoji: '💧', why: '산소가 수소 둘과 손잡았어. 네 몸의 절반 넘게가 물이야!' },
  CO2:  { id: 'CO2', formula: 'CO₂',  name: '이산화탄소',  emoji: '😮‍💨', why: '탄소가 산소 둘과 두 손씩 잡았어. 우리가 내쉬는 숨에 들어 있어!' },
  CH4:  { id: 'CH4', formula: 'CH₄',  name: '메테인(메탄)', emoji: '🔥', why: '탄소가 네 손으로 수소 넷을 잡았어. 가스레인지 불의 연료야!' },
  H3N:  { id: 'H3N', formula: 'NH₃',  name: '암모니아',    emoji: '🧪', why: '질소가 세 손으로 수소 셋을 잡았어. 식물 비료를 만드는 재료야!' },
  ClH:  { id: 'ClH', formula: 'HCl',  name: '염화수소',    emoji: '🫧', why: '물에 녹으면 염산이 돼. 위장에서 음식을 녹이는 위산이 바로 이거야!' },
  ClNa: { id: 'ClNa', formula: 'NaCl', name: '소금',        emoji: '🧂', why: 'Na가 전자를 Cl에게 줘 버려서, 서로 끌어당겨 붙었어!', ionic: true },

/* ================= LOGIC ================= */
function formulaKey(syms) {
  const c = {};
  for (const s of syms) c[s] = (c[s] || 0) + 1;
  return Object.keys(c).sort().map(s => s + (c[s] > 1 ? c[s] : '')).join('');
}

// 받침이 있으면 '은', 없으면 '는' (예: 나트륨은, 수소는)
function topic(word) {
  const c = word.charCodeAt(word.length - 1);
  const hasFinal = c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 !== 0;
  return word + (hasFinal ? '은' : '는');
}

function freeHands(group) {
  const f = {};
  for (const a of group.atoms) f[a.id] = ATOMS[a.sym].hands;
  for (const b of group.bonds) { f[b.a] -= b.order; f[b.b] -= b.order; }
  return f;
}

function findBond(group, aId, bId) {
  return group.bonds.find(b => (b.a === aId && b.b === bId) || (b.a === bId && b.b === aId));
}

function canBond(group, aId, bId) {
  if (aId === bId) return false;
  const f = freeHands(group);
  if (!(f[aId] >= 1) || !(f[bId] >= 1)) return false;
  const ex = findBond(group, aId, bId);
  return !ex || ex.order < 3;
}

function addBond(group, aId, bId) {
  const bonds = group.bonds.map(b => ({ ...b }));
  const ex = bonds.find(b => (b.a === aId && b.b === bId) || (b.a === bId && b.b === aId));
  if (ex) ex.order += 1; else bonds.push({ a: aId, b: bId, order: 1 });
  return { atoms: group.atoms.map(a => ({ ...a })), bonds };
}

function components(group) {
  const adj = {};
  for (const a of group.atoms) adj[a.id] = [];
  for (const b of group.bonds) { adj[b.a].push(b.b); adj[b.b].push(b.a); }
  const seen = new Set(), out = [];
  for (const a of group.atoms) {
    if (seen.has(a.id)) continue;
    const ids = new Set(), stack = [a.id];
    while (stack.length) {
      const x = stack.pop();
      if (ids.has(x)) continue;
      ids.add(x); seen.add(x);
      stack.push(...adj[x]);
    }
    out.push({
      atoms: group.atoms.filter(t => ids.has(t.id)).map(t => ({ ...t })),
      bonds: group.bonds.filter(b => ids.has(b.a)).map(b => ({ ...b })),
    });
  }
  return out;
}

function judge(group) {
  return components(group).map(comp => {
    const key = formulaKey(comp.atoms.map(a => a.sym));
    const f = freeHands(comp);
    // 원자가 둘 이상이거나, 손이 0개인 원자(헬륨·네온)는 혼자서도 완성
    const full = (comp.atoms.length > 1 || ATOMS[comp.atoms[0].sym].hands === 0) && Object.values(f).every(v => v === 0);
    if (!full) return { status: 'incomplete', key, ids: comp.atoms.map(a => a.id) };
    const molecule = MOLECULES[key];
    return molecule
      ? { status: 'known', key, molecule, ids: comp.atoms.map(a => a.id) }
      : { status: 'unknown', key, ids: comp.atoms.map(a => a.id) };
  });
}

/* ================= SAVE ================= */
const SAVE_KEY = 'atomciv.v1';
function defaultState() { return { found: [], missionIdx: 0, muted: false }; }
function loadState() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return defaultState();
    const s = JSON.parse(raw);
    return { ...defaultState(), ...s, found: Array.isArray(s.found) ? s.found : [] };
  } catch (e) { return defaultState(); }
}
// 파일로 저장/불러오기: 다른 기기로 옮기거나 따로 보관할 때
function exportSave(s) {
  return JSON.stringify({ app: 'atomciv', version: 1, savedAt: new Date().toISOString(),
    state: { found: s.found, muted: !!s.muted, trayIntro: !!s.trayIntro, endingEras: s.endingEras || 0 } }, null, 1);
}
function importSave(text) {
  let obj;
  try { obj = JSON.parse(text); } catch (e) { return null; }
  if (!obj || obj.app !== 'atomciv' || !obj.state || !Array.isArray(obj.state.found)) return null;
  const st = obj.state;
  const found = [...new Set(st.found.filter(k => typeof k === 'string' && (MOLECULES[k] || ITEMS[k])))];
  return { ...defaultState(), found, muted: !!st.muted, trayIntro: !!st.trayIntro,
    endingEras: Number.isInteger(st.endingEras) ? st.endingEras : 0 };
}
function saveState(s) {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(s)); } catch (e) { /* 저장 불가: 계속 진행 */ }
}

function sameBag(a, b) {
  if (a.length !== b.length) return false;
  const x = [...a].sort(), y = [...b].sort();
  return x.every((v, i) => v === y[i]);
}
// 그릇에 🔥 불(발명품)이 들어 있으면 '열을 가한다'로 본다
function combineTray(items) {
  const rest = items.filter(x => x !== 'fire');
  if (!rest.length) return null;
  return matchRecipe(rest, items.includes('fire'));
}
function matchRecipe(inputs, heat) {
  const r = RECIPES.find(r => r.heat === !!heat && sameBag(r.inputs, inputs));
  return r ? r.output : null;
}
function eraIndex(found) {
  let i = 0;
  while (i < ERAS.length - 1 && ERAS[i].goal.every(g => found.includes(g))) i++;
  return i;
}

const HEX_DIRS = [[1, 0], [0, 1], [-1, 1], [-1, 0], [0, -1], [1, -1]]; // 모서리 0~5 순서와 맞춘 이웃 방향
function hexDist(a, b) {
  const dq = a[0] - b[0], dr = a[1] - b[1];

}
function hexNeighbors([q, r]) { return HEX_DIRS.map(([dq, dr]) => [q + dq, r + dr]); }
function territory(found) {
  const owned = new Set(), visible = new Set();
  const claim = c => [c, ...hexNeighbors(c)].forEach(t => { if (hexDist(t, [0, 0]) <= MAP_RADIUS) owned.add(t.join(',')); });
  claim([0, 0]); // 수도
  for (const id of found) if (MAP_TILES[id]) claim(MAP_TILES[id]);
  for (const k of owned) {
    const c = k.split(',').map(Number);
    visible.add(k);
    hexNeighbors(c).forEach(t => { if (hexDist(t, [0, 0]) <= MAP_RADIUS) visible.add(t.join(',')); });
  }
  return { owned, visible };
}
function terrainAt(q, r) {
  const d = hexDist([q, r], [0, 0]);
  if (d >= MAP_RADIUS) return 'water';
  for (const id in MAP_TILES) if (MAP_TILES[id][0] === q && MAP_TILES[id][1] === r) return TILE_TERRAIN[id];
  if (d <= 1) return 'grass';
  const h = (((q + 11) * 73856093) ^ ((r + 7) * 19349663)) >>> 0;
  const v = h % 100;
  if (v < 22) return 'forest';
  if (v < 34) return 'hills';
  if (v < 40 && d >= 3) return 'water';
  return 'grass';
}

function benchSize() { const r = benchSvg.getBoundingClientRect(); return { w: r.width, h: r.height }; }
function overlaps(x, y, skip) {
  for (const id in pos) if (id !== skip && Math.hypot(pos[id].x - x, pos[id].y - y) < 2 * R + 6) return true;

}
// 실험대 위에 겹쳐 있는 버튼들(그릇·도구·미션) 영역: 원자가 그 밑에 숨지 않게
function blockedRects() {
  const br = benchSvg.getBoundingClientRect();
  return ['#bench-tools', '#tray', '#mix', '#mission-bar'].map(sel => document.querySelector(sel))
    .filter(e => e && e.offsetParent !== null)

      const m = R + 30; return { l: r.left - br.left - m, t: r.top - br.top - m, r: r.right - br.left + m, b: r.bottom - br.top + m, bottom: r.top - br.top > br.height / 2 }; });
}
function inBlocked(x, y) { return blockedRects().find(b => x > b.l && x < b.r && y > b.t && y < b.b) || null; }
function escapeBlocked(p) {

    if (!b) break;

}
// 새 원자 자리: 그릇·버튼 밑은 절대 피하고, 그 안에서 다른 원자와 덜 겹치는 곳을 고른다
function freeSpot() {
  const { w, h } = benchSize();
  const cx = w / 2, cy = h / 2, step = R + 10, m = R + 8;
  const spots = [];
  for (let y = m; y <= h - m; y += step) for (let x = m; x <= w - m; x += step) {
    if (!inBlocked(x, y)) spots.push({ x, y, d: Math.hypot(x - cx, y - cy) });
  }
  if (!spots.length) return { x: m, y: m };
  spots.sort((p, q) => p.d - q.d);
  const free = spots.find(p => !overlaps(p.x, p.y));
  if (free) return { x: free.x, y: free.y };

  let best = spots[0], bestGap = -1;
  for (const p of spots) {
    let gap = Infinity;
    for (const id in pos) gap = Math.min(gap, Math.hypot(pos[id].x - p.x, pos[id].y - p.y));
    if (gap > bestGap) { bestGap = gap; best = p; }
  }
  return { x: best.x, y: best.y };
}

}

const symOf = id => bench.atoms.find(a => a.id === id).sym;

function renderBench() {

    if (bonded.length && f[a.id] > 0 && !busy.has(a.id)) g.classList.add('needy');

    for (const b of bonded) {

});
benchSvg.addEventListener('pointerup', e => { if (drag && e.pointerId === drag.pointerId) finishDrag(e); });
benchSvg.addEventListener('pointercancel', e => { if (drag && e.pointerId === drag.pointerId) { pos[drag.id] = drag.start; drag = null; renderBench(); } });

function finishDrag(e) {
  const { id, start } = drag; drag = null;
  const dr = drawerEl.getBoundingClientRect();
  if (e.clientX >= dr.left && e.clientX <= dr.right && e.clientY >= dr.top && e.clientY <= dr.bottom) {
    removeAtoms([id]); beep(300, 0.08); return;
  }
  const me = pos[id];
  let target = null, td = 2 * R * 0.95;
  for (const a of bench.atoms) {
    if (a.id === id || busy.has(a.id)) continue;
    const d = Math.hypot(pos[a.id].x - me.x, pos[a.id].y - me.y);
    if (d < td) { td = d; target = a.id; }
  }
  if (target) {
    if (canBond(bench, id, target)) {
      bench = addBond(bench, id, target);
      placeNear(id, target, start);
      beep(880, 0.08);
      renderBench();
      checkComplete();
      // 둘 다 손이 남았으면 이중·삼중결합을 할 수 있다고 알려 준다
      if (!busy.has(id) && canBond(bench, id, target)) toast('손이 남았어! 한 번 더 붙이면 손을 하나 더 잡아 👐');
    } else {
      const f = freeHands(bench);
      const name = sid => ATOMS[bench.atoms.find(a => a.id === sid).sym].name;
      if (f[id] < 1) toast(`${topic(name(id))} 손이 꽉 찼어!`);
      else if (f[target] < 1) toast(`${topic(name(target))} 손이 꽉 찼어!`);
      else toast('손은 세 개까지만 같이 잡을 수 있어!');
      pos[id] = start; beep(220, 0.12); renderBench();
    }
    return;
  }
  const { w, h } = benchSize();
  me.x = Math.min(Math.max(me.x, R + 4), w - R - 4);
  me.y = Math.min(Math.max(me.y, R + 4), h - R - 4);
  escapeBlocked(me);
  renderBench();
}
function placeNear(id, target, from) {
  const t = pos[target];
  let base = Math.atan2(from.y - t.y, from.x - t.x);
  if (!isFinite(base) || Math.hypot(from.y - t.y, from.x - t.x) < 1) base = 0;
  const { w, h } = benchSize();
  for (let k = 0; k < 12; k++) {
    const ang = base + (k % 2 ? 1 : -1) * Math.ceil(k / 2) * (Math.PI / 6);
    const x = t.x + Math.cos(ang) * SNAP, y = t.y + Math.sin(ang) * SNAP;
    if (x < R || y < R || x > w - R || y > h - R) continue;
    if (!overlaps(x, y, id) && !inBlocked(x, y)) { pos[id] = { x, y }; return; }
  }
  pos[id] = { x: t.x + Math.cos(base) * SNAP, y: t.y + Math.sin(base) * SNAP };
}

/* ---- completion ---- */
function checkComplete() {
  for (const r of judge(bench)) {
    if (r.status === 'incomplete' || r.ids.some(i => busy.has(i))) continue;
    r.ids.forEach(i => busy.add(i));
    renderBench();
    setTimeout(() => {
      const isNew = r.status === 'known' && discover(r.key);
      queueCard(r.status === 'known'
        ? { emoji: r.molecule.emoji, tag: isNew ? '✨ 새 발견!' : '또 만들었어!', name: r.molecule.name,
            formula: r.molecule.formula, why: r.molecule.why, onClose: () => { removeAtoms(r.ids); afterMake(r.key); dropIntoTray(r.key); } }
        : { emoji: '🤔', tag: '규칙은 맞지만', name: '아직 이름 모르는 분자!', formula: pretty(r.key),
            why: '모든 손을 다 잡았어! 과학자들은 더 많은 분자를 알고 있단다.', onClose: () => removeAtoms(r.ids) });
      if (isNew) fanfare();
    }, 650);
  }
}
function discover(key) {
  if (state.found.includes(key)) return false;
  state.found.push(key); saveState(state);
  return true;
}
function afterMake(key) {
  renderDrawer();

}

/* ---- tray & combine ---- */
// 재료 칩을 손가락으로 끌기: 조금 움직이면 끌기 시작, 놓은 자리를 onDrop에 알려 준다
function overTray(x, y) {
  const r = $('#tray').getBoundingClientRect(), pad = 24;
  return x >= r.left - pad && x <= r.right + pad && y >= r.top - pad && y <= r.bottom + pad;
}
function chipDrag(chip, emoji, onDrop) {
  let start = null, ghost = null;
  chip.addEventListener('pointerdown', e => {
    start = { x: e.clientX, y: e.clientY, id: e.pointerId };
    try { chip.setPointerCapture(e.pointerId); } catch (err) { /* 무시 */ }
  });
  chip.addEventListener('pointermove', e => {
    if (!start || e.pointerId !== start.id) return;
    if (!ghost && Math.hypot(e.clientX - start.x, e.clientY - start.y) < 10) return;
    if (!ghost) { ghost = el('div', { class: 'drag-ghost' }, emoji); document.body.append(ghost); }
    ghost.style.left = e.clientX + 'px'; ghost.style.top = e.clientY + 'px';
    $('#tray').classList.toggle('drop-ready', overTray(e.clientX, e.clientY));
  });
  const end = (e, cancelled) => {
    if (!start || e.pointerId !== start.id) return;
    start = null;
    $('#tray').classList.remove('drop-ready');
    if (!ghost) return;
    ghost.remove(); ghost = null;
    chip.dataset.dragged = '1'; // 끌기 뒤에 따라오는 click은 무시
    setTimeout(() => { delete chip.dataset.dragged; }, 400);
    if (!cancelled) onDrop(e.clientX, e.clientY);
  };
  chip.addEventListener('pointerup', e => end(e, false));
  chip.addEventListener('pointercancel', e => end(e, true));
}
// 레시피 재료로 쓰이는 분자(물, 모래)는 만들자마자 그릇으로 쏙 넣어 준다
function dropIntoTray(key) {
  if (!RECIPES.some(r => r.inputs.includes(key))) return;
  if (tray.includes(key) || tray.length >= TRAY_MAX) return;
  tray.push(key); renderTray();
  const chips = document.querySelectorAll('#tray-items .item-chip');
  if (chips.length) chips[chips.length - 1].classList.add('pop-in');
  toast(`${MOLECULES[key].emoji} ${MOLECULES[key].name} 그릇으로 쏙!`);
}
let tray = [];
const TRAY_MAX = 6;
function addToTray(id) {
  if (tray.length >= TRAY_MAX) { toast('그릇에는 6개까지만 넣을 수 있어!'); return; }
  tray.push(id); beep(520, 0.05); renderTray();
}
function renderTray() {
  const box = $('#tray-items');
  box.textContent = '';
  tray.forEach((id, i) => {
    const it = ITEMS[id] || MOLECULES[id];
    const b = el('button', { class: 'item-chip', 'data-item': id, 'aria-label': it.name + ' 빼기' });
    b.append(el('span', { class: 'em' }, it.emoji), el('span', { class: 'lbl' }, it.name));
    chipDrag(b, it.emoji, (x, y) => { if (!overTray(x, y)) { tray.splice(i, 1); renderTray(); } });
    b.addEventListener('click', () => { if (b.dataset.dragged) { delete b.dataset.dragged; return; } tray.splice(i, 1); renderTray(); });
    box.append(b);
  });
  $('#tray').classList.toggle('empty', !tray.length);
  $('#tray-empty').hidden = tray.length > 0;
  renderTools();
}
function renderTools() {
  $('#combine-btn').disabled = !tray.length;
}
$('#combine-btn').addEventListener('click', () => {

    tray_.classList.remove('bounce'); void tray_.offsetWidth; tray_.classList.add('bounce');
    beep(220, 0.12);

const TERRAIN_COLOR = { grass: '#a8d977', forest: '#74b45e', hills: '#cdb27c', river: '#86c9ea', sand: '#f0dca0', water: '#5aa9e6', plains: '#d6e39a' };
const TERRAIN_DECO = { forest: '🌲', hills: '⛰️', water: '', river: '〰️' };
function renderMap(body) {
  const { owned, visible } = territory(state.found);
  const idx = eraIndex(state.found), era = ERAS[idx];
  const left = era.goal.filter(g => !state.found.includes(g)).length;
  body.append(el('div', { id: 'map-info' }, `${era.emoji} ${era.name}, 우리 땅 ${owned.size}칸`));
  body.append(el('div', { id: 'map-next' }, left ? `다음 시대까지 발명 ${left}개 남았어` : '이 시대의 발명을 다 했어! 🎉'));
  const S = 28, W = Math.sqrt(3) * S;
  const px = (q, r) => [W * (q + r / 2), 1.5 * S * r];
  const corners = (cx, cy) => [0, 1, 2, 3, 4, 5].map(i => {
    const a = Math.PI / 180 * (60 * i - 30);
    return [cx + S * Math.cos(a), cy + S * Math.sin(a)];
  });
  const R = MAP_RADIUS, vw = W * (2 * R + 1) + 8, vh = 1.5 * S * 2 * R + 2 * S + 8;
  const svg = sv('svg', { id: 'map-svg', viewBox: `${-vw / 2} ${-vh / 2} ${vw} ${vh}`, role: 'img', 'aria-label': '우리 영토 지도' });
  const tiles = sv('g'), borders = sv('g'), marks = sv('g');
  for (let q = -R; q <= R; q++) for (let r = -R; r <= R; r++) {
    if (hexDist([q, r], [0, 0]) > R) continue;
    const key = q + ',' + r, [cx, cy] = px(q, r), cs = corners(cx, cy);
    const terr = terrainAt(q, r), isOwned = owned.has(key), isFog = !visible.has(key);
    const g = sv('g', { class: `hex ${terr}${isOwned ? ' owned' : ''}${isFog ? ' fog' : ''}`, 'data-q': q, 'data-r': r });
    const pts = cs.map(c => c.join(',')).join(' ');
    g.append(sv('polygon', { points: pts, fill: TERRAIN_COLOR[terr], stroke: 'rgba(0,0,0,.12)', 'stroke-width': 1 }));
    if (isOwned) g.append(sv('polygon', { points: pts, fill: 'rgba(45,91,227,.16)' }));
    const isSite = Object.values(MAP_TILES).some(t => t[0] === q && t[1] === r);
    if (!isFog && TERRAIN_DECO[terr] && !isSite && !(q === 0 && r === 0)) {
      const t = sv('text', { x: cx, y: cy + 6, 'text-anchor': 'middle', 'font-size': 16, opacity: .75 });
      t.textContent = TERRAIN_DECO[terr]; g.append(t);
    }
    if (isFog) {
      g.append(sv('polygon', { points: pts, fill: '#efe9dd', opacity: .93 }));
      if ((q * 7 + r * 13 + 100) % 3 === 0) {
        const t = sv('text', { x: cx, y: cy + 6, 'text-anchor': 'middle', 'font-size': 16, opacity: .6 });
        t.textContent = '☁️'; g.append(t);
      }
    }
    tiles.append(g);
    if (isOwned) cs.forEach((c, i) => { // 영토 경계선: 이웃이 우리 땅이 아니면 그 모서리를 그린다
      const [dq, dr] = HEX_DIRS[i];
      if (owned.has((q + dq) + ',' + (r + dr))) return;
      const n = cs[(i + 1) % 6];
      borders.append(sv('line', { class: 'border-edge', x1: c[0], y1: c[1], x2: n[0], y2: n[1],
        stroke: '#2d5be3', 'stroke-width': 4, 'stroke-linecap': 'round' }));
    });
  }
  const [ccx, ccy] = px(0, 0);
  marks.append(sv('circle', { cx: ccx, cy: ccy, r: 17, fill: '#fff', stroke: '#2d5be3', 'stroke-width': 3 }));
  const cap = sv('text', { x: ccx, y: ccy + 8, 'text-anchor': 'middle', 'font-size': 22 }); cap.textContent = '🏛️'; marks.append(cap);
  for (const id in MAP_TILES) {
    const [q, r] = MAP_TILES[id], [cx, cy] = px(q, r), key = q + ',' + r;
    const lit = state.found.includes(id), seen = visible.has(key);
    const g = sv('g', { class: 'map-node', 'data-id': id, 'data-lit': String(lit) });
    if (lit) {
      g.append(sv('circle', { cx, cy, r: 16, fill: '#fff', stroke: '#ffd23f', 'stroke-width': 3 }));
      const t = sv('text', { x: cx, y: cy + 7, 'text-anchor': 'middle', 'font-size': 20 }); t.textContent = ITEMS[id].emoji; g.append(t);
      g.addEventListener('click', () => queueCard({ emoji: ITEMS[id].emoji, name: ITEMS[id].name, why: ITEMS[id].why }));
    } else if (seen) {
      const t = sv('text', { x: cx, y: cy + 7, 'text-anchor': 'middle', 'font-size': 18, opacity: .45 }); t.textContent = '❔'; g.append(t);
    }
    marks.append(g);
  }
  svg.append(tiles, borders, marks);
  body.append(svg);
}

function renderVillage(eraId) {
  const v = $('#village');
  v.setAttribute('viewBox', '0 0 1000 520');
  v.setAttribute('preserveAspectRatio', 'xMidYMax slice');
  v.dataset.era = eraId;
  v.innerHTML = `<rect x="0" y="470" width="1000" height="60" fill="#cfe8a9" opacity=".6"/>
    <path d="M0 470 Q250 400 500 450 T1000 440 V470 H0Z" fill="#b7dc8f" opacity=".5"/>` + VILLAGE[eraId];
}
$('#panel-close').addEventListener('click', () => setTab(tab));
document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));

$('#clear-btn').addEventListener('click', () => removeAtoms(bench.atoms.map(a => a.id).filter(i => !busy.has(i))));
/* ---- save / load ---- */
function renderSave(body) {
  const n = state.found.length;
  body.append(el('p', { class: 'save-note' }, `지금까지 ${n}개를 만들었어. 이 기기에는 자동으로 저장돼!`));
  body.append(el('p', { class: 'save-note' }, '다른 기기로 옮기거나 따로 보관하려면 파일로 저장해 둬.'));
  const row = el('div', { class: 'save-row' });
  const saveBtn = el('button', { id: 'save-file' }, '💾 파일로 저장하기');
  saveBtn.addEventListener('click', downloadSave);
  const loadLbl = el('label', { class: 'load-btn', for: 'load-file' }, '📂 파일 불러오기');
  const input = el('input', { id: 'load-file', type: 'file', accept: '.json,application/json' });
  input.addEventListener('change', () => { const f = input.files && input.files[0]; if (f) loadSaveFile(f); input.value = ''; });
  row.append(saveBtn, loadLbl, input);
  body.append(row);
}
function downloadSave() {
  const blob = new Blob([exportSave(state)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = el('a', { href: url, download: `atomciv-save-${new Date().toISOString().slice(0, 10)}.json` });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  toast('💾 저장 파일을 만들었어!');
}
function loadSaveFile(file) {
  file.text().then(text => {
    const loaded = importSave(text);
    if (!loaded) { toast('이 파일은 불러올 수 없어 😢'); beep(220, 0.12); return; }
    state = loaded; saveState(state);
    tray = []; shownEra = null;
    removeAtoms(bench.atoms.map(a => a.id));
    renderDrawer(); renderTray(); checkEra(); renderMute();
    setTab(START_TAB());
    queueCard({ plain: true, emoji: '📂', tag: '불러왔어!', name: `${state.found.length}개를 다시 기억해 냈어`,
      why: '저장해 둔 곳부터 이어서 해 보자!' });
  }).catch(() => toast('이 파일은 불러올 수 없어 😢'));
}
function renderMute() { $('#mute').textContent = state.muted ? '🔇' : '🔊'; }
$('#save-menu').addEventListener('click', () => openPanel('save'));
$('#mute').addEventListener('click', () => { state.muted = !state.muted; saveState(state); renderMute(); });
window.addEventListener('resize', () => {
  const { w, h } = benchSize();
  for (const id in pos) { pos[id].x = Math.min(pos[id].x, w - R); pos[id].y = Math.min(pos[id].y, h - R); }
  renderBench();
});

/*INIT_MORE*/
renderDrawer();
renderTray();
checkEra();
renderMute();
setTab(START_TAB());
renderBench();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
function START_TAB() { return currentMission(state.found) ? 'mission' : 'lab'; }
</script>
