<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>짤저장</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<style>
:root{--bg:#111;--card:#1c1c1e;--fg:#f2f2f2;--mut:#9a9a9f;--ac:#ff4d79;--err:#ff8a80}
@media (prefers-color-scheme:light){:root{--bg:#f5f5f7;--card:#fff;--fg:#1d1d1f;--mut:#6e6e73;--err:#c62828}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto}
h1{font-size:22px;margin:8px 0 4px}
p.sub{color:var(--mut);margin:0 0 16px;font-size:14px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;padding:14px;border-radius:12px;border:1px solid #3a3a3c;background:var(--card);color:var(--fg);font-size:16px}
button{padding:14px 18px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:16px;font-weight:600}
button:disabled{opacity:.5}
button.sec{background:var(--card);color:var(--fg);border:1px solid #3a3a3c}
#msg{margin:14px 0;color:var(--err);min-height:1.4em}
#msg.ok{color:var(--mut)}
.grid{display:grid;gap:12px;margin-top:12px}
.item{background:var(--card);border-radius:14px;overflow:hidden}
.item img,.item video{display:block;width:100%;max-height:70vh;object-fit:contain;background:#000}
.item .bar{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;color:var(--mut);font-size:14px}
</style>
</head>
<body>
<main>
  <h1>짤저장</h1>
  <p class="sub">인스타그램·스레드 공개 게시물 링크를 붙여넣어 사진/영상을 저장해요. 개인 소장용으로만 쓰세요.</p>
  <div class="row">
    <input id="url" type="url" inputmode="url" placeholder="https://www.instagram.com/p/..." autocomplete="off">
    <button id="go">가져오기</button>
  </div>
  <div id="msg" role="status"></div>
  <div id="all" hidden><button id="saveAll" class="sec" style="width:100%">전체 저장</button></div>
  <div id="list" class="grid"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const ERR = {
  blocked: "인스타가 서버 접근을 막았어요. 잠시 뒤 다시 해보세요.",
  private_or_login: "비공개이거나 로그인이 필요한 게시물이에요.",
  unsupported_url: "인스타그램/스레드 게시물 링크만 지원해요.",
  not_found: "이 링크에서 사진이나 영상을 찾지 못했어요.",
  unknown: "가져오는 중 알 수 없는 오류가 났어요. 링크를 확인하거나 잠시 뒤 다시 해보세요."
};
let items = [];

function setMsg(t, ok){ const m=$("msg"); m.textContent=t||""; m.className=ok?"ok":""; }
function extOf(it){ return it.type==="video" ? "mp4" : "jpg"; }
function dlUrl(it,i){ return "api/download?u="+encodeURIComponent(it.url)+"&name="+encodeURIComponent("igsave-"+(i+1)+"."+extOf(it)); }

async function saveOne(it,i,noShare){
  const name = "igsave-"+(i+1)+"."+extOf(it);
  let blob;
  try{
    const res = await fetch(dlUrl(it,i));
    if(!res.ok) throw new Error(res.status);
    blob = await res.blob();
  }catch(e){
    setMsg(it.type==="video" ? "영상을 받지 못했어요. 용량이 큰 영상은 서버 제한 때문일 수 있어요." : "사진을 받지 못했어요. 잠시 뒤 다시 해보세요.");
    return;
  }
  // Share sheet needs a fresh tap; if it is refused (or we are batch-saving) fall back to a plain download.
  if(!noShare){
    const file = new File([blob], name, {type: blob.type});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file]}); return; }
      catch(e){ if(e && e.name==="AbortError") return; }
    }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 10000);
}

function render(){
  const list=$("list"); list.textContent="";
  items.forEach((it,i)=>{
    const card=document.createElement("div"); card.className="item";
    const media=document.createElement(it.type==="video"?"video":"img");
    if(it.type==="video"){ media.controls=true; media.playsInline=true; media.preload="none"; if(it.thumb) media.poster=it.thumb; }
    media.src = "api/download?u="+encodeURIComponent(it.url);
    const bar=document.createElement("div"); bar.className="bar";
    const label=document.createElement("span"); label.textContent=(it.type==="video"?"영상 ":"사진 ")+(i+1);
    const btn=document.createElement("button"); btn.textContent="저장"; btn.onclick=()=>saveOne(it,i);
    bar.append(label,btn); card.append(media,bar); list.append(card);
  });
  $("all").hidden = items.length<2;
}

async function run(url){
  url=(url||"").trim(); if(!url) return;
  $("go").disabled=true; setMsg("가져오는 중…",true); items=[]; render();
  try{
    const res = await fetch("api/resolve?url="+encodeURIComponent(url));
    const data = await res.json();
    if(!data.ok){ setMsg(ERR[data.error]||"알 수 없는 오류가 났어요."); }
    else { items=data.items; setMsg(items.length+"개를 찾았어요.",true); render(); }
  }catch(e){ setMsg("서버에 연결하지 못했어요."); }
  $("go").disabled=false;
}

$("go").onclick=()=>run($("url").value);
$("url").addEventListener("keydown",e=>{ if(e.key==="Enter") run($("url").value); });
$("saveAll").onclick=async()=>{ for(let i=0;i<items.length;i++) await saveOne(items[i],i,true); };

// Share Target: ?url=… or ?text=… containing a link
const p=new URLSearchParams(location.search);
const shared=p.get("url")||(p.get("text")||"").match(/https?:\/\/\S+/)?.[0];
if(shared){ $("url").value=shared; run(shared); history.replaceState(null,"",location.pathname); }

if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
