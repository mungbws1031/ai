<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>주차 한 판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
/* 시험판(spike): 하루 버티기 + 직접 주차. 버려도 되는 코드입니다. */
:root { color-scheme: dark; --ink: #17202a; --cash: #ffd23a; --bad: #ff5a5a; --good: #3ccf7d; --sign: #0b5aa8;
  --display: 'Do Hyeon', 'Noto Sans KR', sans-serif; --body: 'Noto Sans KR', system-ui, sans-serif; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #2b3036; color: #f4f5f0; font-family: var(--body); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; border: 0; cursor: pointer; }
.hidden { display: none !important; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

.hud { position: fixed; top: max(8px, env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left)); right: max(10px, env(safe-area-inset-right)); display: flex; align-items: flex-start; gap: 10px; pointer-events: none; }
.wallet { background: rgba(23,32,42,.88); border-radius: 12px; padding: 6px 12px; font-family: var(--display); font-size: 30px; line-height: 1; color: var(--cash); min-width: 150px; }
.wallet small { display: block; font-family: var(--body); font-size: 11px; color: #9aa3ad; margin-bottom: 2px; }
.wallet.hit { animation: hit .5s; } @keyframes hit { 30% { transform: scale(1.12); color: var(--bad); } }
.mission { flex: 1; text-align: center; background: rgba(23,32,42,.88); border-radius: 12px; padding: 6px 12px; font-size: 14px; max-width: 460px; margin: 0 auto; }
.mission b { font-family: var(--display); font-weight: 400; font-size: 20px; }
.timer { font-family: var(--display); font-size: 30px; line-height: 1; background: rgba(23,32,42,.88); border-radius: 12px; padding: 6px 12px; min-width: 70px; text-align: center; }
.timer.late { color: var(--bad); }
.quit { pointer-events: auto; position: fixed; right: max(10px, env(safe-area-inset-right)); bottom: max(10px, env(safe-area-inset-bottom)); font-size: 12px; opacity: .6; background: none; }

.best { font-size: 13px; color: #4a5563; }
.pad { position: fixed; bottom: max(14px, env(safe-area-inset-bottom)); display: flex; gap: 12px; touch-action: none; }
.pad.left { left: max(14px, env(safe-area-inset-left)); }
.pad.right { right: max(14px, env(safe-area-inset-right)); bottom: max(34px, env(safe-area-inset-bottom)); }
.pad button { width: min(19vh, 92px); height: min(19vh, 92px); border-radius: 50%; background: rgba(23,32,42,.82); border: 3px solid rgba(255,255,255,.25); font-size: 34px; font-family: var(--display); }
.pad button.on { background: rgba(255,255,255,.28); }
.pad .gas { background: rgba(31,138,82,.85); } .pad .rev { background: rgba(163,25,31,.8); font-size: 22px; }
.stick { position: fixed; left: max(18px, env(safe-area-inset-left)); bottom: max(18px, env(safe-area-inset-bottom)); width: min(42vh, 170px); height: min(42vh, 170px); border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,.10) 0 40%, rgba(23,32,42,.82) 41%); border: 3px solid rgba(255,255,255,.28); touch-action: none; }
.stick .knob { position: absolute; left: 50%; top: 50%; width: 42%; height: 42%; margin: -21% 0 0 -21%; border-radius: 50%; background: #f1f2ee; box-shadow: 0 4px 12px rgba(0,0,0,.5); pointer-events: none; }
.stick span { position: absolute; left: 0; right: 0; top: -20px; text-align: center; font-size: 11px; color: #9aa3ad; white-space: nowrap; }
.parkbtn { position: fixed; right: max(18px, env(safe-area-inset-right)); bottom: max(34px, env(safe-area-inset-bottom)); width: min(30vh, 118px); height: min(30vh, 118px); background: var(--sign); border: 3px solid #fff; border-radius: 50%; font-family: var(--display); font-size: 20px; line-height: 1.15; box-shadow: 0 6px 18px rgba(0,0,0,.4); }
.parkbtn:disabled { opacity: .35; }

.flash { position: fixed; left: 50%; top: 30%; transform: translate(-50%, -50%); font-family: var(--display); font-size: 34px; text-shadow: 0 3px 10px rgba(0,0,0,.7); pointer-events: none; white-space: nowrap; }

.card-wrap { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(12,15,19,.72); padding: 14px; z-index: 5; }
.card { width: min(520px, 96vw); max-height: 94vh; overflow: auto; background: #f1f2ee; color: var(--ink); border-radius: 16px; padding: 16px 18px; touch-action: pan-y; }
.card h2 { font-family: var(--display); font-weight: 400; font-size: 28px; margin: 0 0 6px; line-height: 1.15; }
.card p { margin: 6px 0; line-height: 1.5; }
.card .big { font-family: var(--display); font-size: 40px; color: #b8860b; }
.lines { margin: 10px 0; border-top: 2px dashed #c9ccc4; }
.lines div { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid #dcdfd8; }
.lines .minus { color: #c0262d; font-weight: 700; } .lines .plus { color: #1f7a48; font-weight: 700; }
.why { font-size: 13px; color: #4a5563; }
.go { width: 100%; margin-top: 10px; min-height: 52px; border-radius: 12px; background: var(--ink); color: #fff; font-family: var(--display); font-size: 22px; }
.tag { display: inline-block; font-size: 12px; font-weight: 700; background: #ffd23a; color: #3a2c00; border-radius: 999px; padding: 1px 9px; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud">
  <div class="wallet" id="wallet"><small>지갑</small><span id="money">50,000원</span></div>
  <div class="mission" id="mission"></div>
  <div class="timer" id="timer">0:45</div>
</div>
<div class="stick" id="stick" aria-label="조이스틱: 가고 싶은 방향으로 밀기"><div class="knob" id="knob"></div><span>가고 싶은 쪽으로 밀기</span></div>
<button class="parkbtn" id="parkBtn" disabled>여기<br>세우기 P</button>
<button class="quit" id="quit">처음으로</button>
<div class="flash hidden" id="flash"></div>
<div class="card-wrap" id="cardWrap"><div class="card" id="card"></div></div>

<script src="../rules.js"></script>
<script src="../levels.js"></script>
<script src="../judge.js"></script>
<script src="render.js"></script>
<script>
/* 시험판 v3: 매 판 무작위 · 눈에 보이는 단속원/주민 · 5곳짜리 하루 + 최고 기록. 버려도 되는 코드. */
(() => {
  const J = window.Judge, R = window.PGRender, RULES = window.RULES, PI = Math.PI, CAR = J.CAR;
  const $ = s => document.querySelector(s);
  const won = n => (n < 0 ? '−' : '') + Math.abs(Math.round(n)).toLocaleString('ko-KR') + '원';
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const wrap = a => Math.atan2(Math.sin(a), Math.cos(a));
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const shuffle = arr => arr.map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
  const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

  // 하루 일정 — 장소마다 단속원 순찰길(왕복), 주민이 설 수 있는 자리 [x, y, 바라보는 방향]
  const DAY = [
    { key: 'mart', who: '마트', task: '장보기', limit: 45, stays: [20, 40, 60], loop: 30, guard: '주차 관리 요원',
      patrol: [[4, 20.8], [68, 20.8]], watchers: [[30, 10.4, PI / 2], [50, 10.4, PI / 2], [14, 21.5, 0], [60, 22, PI]], n: 2 },
    { key: 'hospital', who: '병원', task: '엄마 진료', limit: 50, stays: [20, 40, 60], loop: 40, guard: '단속 공무원',
      patrol: [[4, 13.6], [106, 13.6]], watchers: [[44, 13.6, PI / 2], [70, 13.6, PI / 2], [20, 30.5, -PI / 2], [90, 30.5, -PI / 2]], n: 2,
      maybeCar: { x: 93.7, y: 16.25, heading: PI } },
    { key: 'market', who: '전통시장', task: '장보기', limit: 50, stays: [30, 60, 120], loop: 35, guard: '단속 공무원',
      patrol: [[4, 13], [106, 13]], watchers: [[71, 12.9, PI / 2], [35, 27, -PI / 2], [90, 27, -PI / 2], [50, 13, PI / 2]], n: 2 },
    { key: 'station', who: '지하철역', task: '가족 마중', limit: 55, stays: [10, 20, 40], loop: 30, guard: '단속 공무원',
      patrol: [[4, 13], [116, 13]], watchers: [[39, 13, PI / 2], [56, 13, PI / 2], [100, 31, -PI / 2], [30, 31, -PI / 2]], n: 2 },
    { key: 'school', who: '학교 앞', task: '학원 상담', limit: 60, stays: [20, 40, 60], loop: 25, guard: '단속 공무원',
      patrol: [[4, 13.5], [146, 13.5]], watchers: [[34, 30.6, -PI / 2], [64, 30.6, -PI / 2], [78, 13.4, PI / 2], [110, 30.6, -PI / 2]], n: 3 },
  ];
  const START = 50000, ON_TIME = 10000, LATE = 5000, CRASH = 10000, STICKER = 5000, NOTICE = 15000, TOW = 40000;
  const SEE_R = 16, SEE_HALF = 35 * PI / 180, ENC_R = 7;

  const cv = $('#cv'), ctx = cv.getContext('2d');
  let S = null;

  function hhmm(t) { const [h, m] = t.split(':').map(Number); return h * 60 + m; }
  function fmt(min) { min = Math.round(min) % 1440; return `${String(Math.floor(min / 60)).padStart(2, '0')}:${String(min % 60).padStart(2, '0')}`; }

  // ─── 장소 준비: 매번 다르게 ───
  function prepare(d) {
    const base = LEVELS.find(l => l.key === d.key);
    const lv = JSON.parse(JSON.stringify(base));
    lv.props = (lv.props || []).filter(p => p.type !== 'reporter');
    const normal = lv.slots.filter(s => !s.disabled && !['ev', 'pregnant', 'compact', 'women', 'resident'].includes(s.type));
    normal.forEach(s => { s.occupied = Math.random() < 0.85; s.freesOnCall = false; s.color = s.color || pick(['#e9e9e4', '#b8bcc2', '#2b2f36', '#6d7782', '#8c2f2f', '#2f4a6b']); });
    if (normal.length && !normal.some(s => !s.occupied)) pick(normal).occupied = false;
    const parked = (lv.parked || []).map(c => ({ ...c }));
    if (d.maybeCar && Math.random() < 0.4) parked.push({ ...d.maybeCar, color: '#8c2f2f' });
    lv.slots.forEach(s => { if (J.slotOccupied(s, {})) parked.push({ x: s.x + s.w / 2, y: s.y + s.h / 2, heading: s.h > s.w ? (Math.random() < 0.5 ? PI / 2 : -PI / 2) : (s.dir ?? 0), color: s.color, slot: s.id }); });
    const watchers = shuffle(d.watchers).slice(0, d.n).map(([x, y, a]) => ({ x, y, base: a, ph: Math.random() * 6.28, sp: 5 + Math.random() * 4 }));
    return { lv, parked, watchers, phase: Math.random() * d.loop, stay: pick(d.stays) };
  }
  function encAt(d, P, t) {
    const [a, b] = d.patrol, u = (((t + P.phase) / d.loop) % 1 + 1) % 1, f = u < 0.5 ? u * 2 : 2 - u * 2;
    return { x: a[0] + (b[0] - a[0]) * f, y: a[1] + (b[1] - a[1]) * f, dir: u < 0.5 ? 1 : -1 };
  }
  const watchAng = (w, t) => w.base + 0.95 * Math.sin(2 * PI * t / w.sp + w.ph);
  const sees = (w, t, p) => dist(w, p) <= SEE_R && Math.abs(wrap(Math.atan2(p.y - w.y, p.x - w.x) - watchAng(w, t))) <= SEE_HALF;

  // ─── 화면 카드 ───
  function card(html, btn, onGo) {
    $('#card').innerHTML = html + `<button class="go" id="go">${btn}</button>`;
    $('#cardWrap').classList.remove('hidden');
    $('#go').onclick = () => { $('#cardWrap').classList.add('hidden'); onGo(); };
  }
  function title() {
    S = null;
    const best = store.get('pg-day-best', null);
    card(`<h2>주차 한 판</h2>
      <p>지갑에 <b>50,000원</b>. 오늘 다섯 곳을 돌아야 해요.</p>
      <p><b>노란 조끼 단속원</b>이 길을 오가고, <b>주민</b>은 주황색 시야로 두리번거려요. 안 보일 때 잠깐 세울지, 멀어도 제대로 넣을지는 당신 몫.</p>
      <p class="why">왼쪽 동그라미를 가고 싶은 쪽으로 밀기 · 차 뒤로 당기면 후진 · 다 세웠으면 <b>여기 세우기 P</b></p>
      ${best != null ? `<p class="best">최고 기록: <b>${won(best)}</b></p>` : ''}
      <p class="why"><span class="tag">시험판</span> 매 판 빈자리·주민·머무는 시간이 바뀝니다.</p>`, '출발', startDay);
  }
  function startDay() { S = { money: START, i: 0, log: [] }; setMoney(0); place(0); }
  function place(i) {
    const d = DAY[i], P = prepare(d), lv = P.lv;
    Object.assign(S, { i, d, P, lv, parked: P.parked, left: d.limit, crash: 0, cool: 0, ff: null, done: false, running: false,
      car: { x: lv.start.x, y: lv.start.y, heading: lv.start.heading, v: 0, steer: 0 }, clock: hhmm(lv.clock) });
    $('#mission').innerHTML = `<b>${i + 1}/${DAY.length} · ${d.who}</b> — ${d.task} ${P.stay}분<br><span style="color:#9aa3ad">${d.guard} 1명 · 지켜보는 주민 ${P.watchers.length}명</span>`;
    card(`<h2>${i + 1}. ${lv.title}</h2><p>${d.task}, 오늘은 <b>${P.stay}분</b> 걸려요. <b>${d.limit}초 안에</b> 세우면 약속 보너스 <b>+${won(ON_TIME)}</b>.</p>
      <p class="why">${d.guard}은 ${d.loop}분마다 한 바퀴 돌아요. 오래 머물수록 마주칠 확률이 커집니다.</p>
      <p>지갑: <b>${won(S.money)}</b></p>`, '운전 시작', () => { S.running = true; });
  }

  // ─── 입력: 조이스틱 + 키보드 ───
  const keys = {}, stick = { on: false, mag: 0, ang: 0, rev: false };
  const stEl = $('#stick'), knob = $('#knob');
  function stickMove(e) {
    const r = stEl.getBoundingClientRect(), R0 = r.width / 2;
    let dx = e.clientX - (r.left + R0), dy = e.clientY - (r.top + R0);
    const dd = Math.hypot(dx, dy), lim = R0 * 0.62;
    if (dd > lim) { dx *= lim / dd; dy *= lim / dd; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    stick.mag = Math.min(1, dd / lim); stick.ang = Math.atan2(dy, dx);
  }
  stEl.addEventListener('pointerdown', e => { e.preventDefault(); stEl.setPointerCapture(e.pointerId); stick.on = true; stickMove(e); });
  stEl.addEventListener('pointermove', e => { if (stick.on) stickMove(e); });
  const stickOff = () => { stick.on = false; stick.mag = 0; knob.style.transform = ''; };
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => stEl.addEventListener(ev, stickOff));
  const KM = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'gas', ArrowDown: 'back' };
  addEventListener('keydown', e => { if (KM[e.key]) { keys[KM[e.key]] = true; e.preventDefault(); } if (e.key === ' ' || e.key === 'p') tryPark(); });
  addEventListener('keyup', e => { if (KM[e.key]) keys[KM[e.key]] = false; });
  addEventListener('blur', () => Object.keys(keys).forEach(k => keys[k] = false));
  $('#parkBtn').onclick = () => tryPark();
  $('#quit').onclick = () => title();

  // ─── 물리 ───
  function overlap(a, b) {
    for (const poly of [a, b]) for (let i = 0; i < poly.length; i++) {
      const p = poly[i], q = poly[(i + 1) % poly.length], nx = q.y - p.y, ny = p.x - q.x;
      let a0 = Infinity, a1 = -Infinity, b0 = Infinity, b1 = -Infinity;
      for (const v of a) { const k = v.x * nx + v.y * ny; a0 = Math.min(a0, k); a1 = Math.max(a1, k); }
      for (const v of b) { const k = v.x * nx + v.y * ny; b0 = Math.min(b0, k); b1 = Math.max(b1, k); }
      if (a1 < b0 || b1 < a0) return false;
    }
    return true;
  }
  const rp = r => [{ x: r.x, y: r.y }, { x: r.x + r.w, y: r.y }, { x: r.x + r.w, y: r.y + r.h }, { x: r.x, y: r.y + r.h }];
  function hit(pose) {
    const poly = J.carCorners(pose), lv = S.lv;
    if (poly.some(p => p.x < 0 || p.y < 0 || p.x > lv.world.w || p.y > lv.world.h)) return 'edge';
    for (const b of lv.buildings) if (overlap(poly, rp(b))) return 'wall';
    for (const c of S.parked) if (overlap(poly, J.carCorners(c))) return 'car';
    return null;
  }
  function step(dt) {
    const c = S.car;
    let target = 0, vt = 0;
    if (stick.on && stick.mag > 0.15) {
      const df = wrap(stick.ang - c.heading), off = Math.abs(df);
      if (stick.rev ? off < 1.2 : off > 1.95) stick.rev = !stick.rev;
      if (!stick.rev) { target = clamp(df / 0.55, -1, 1); vt = stick.mag * 4.5; }
      else { target = -clamp(wrap(stick.ang - c.heading - PI) / 0.55, -1, 1); vt = -stick.mag * 2.8; }
    } else { target = keys.left ? -1 : keys.right ? 1 : 0; vt = keys.gas ? 6 : keys.back ? -2.8 : 0; }
    c.steer += clamp(target - c.steer, -dt * 4, dt * 4);
    const dv = vt - c.v, a = Math.sign(dv) === Math.sign(c.v) || !c.v ? 3.5 : 7;
    c.v += clamp(dv, -a * dt, a * dt);
    if (Math.abs(c.v) < 0.02 && !vt) c.v = 0;
    if (!c.v) return;
    const st = c.steer * 35 * PI / 180;
    const nx = { heading: c.heading + c.v / CAR.wheelbase * Math.tan(st) * dt, x: c.x + Math.cos(c.heading) * c.v * dt, y: c.y + Math.sin(c.heading) * c.v * dt };
    const h = hit(nx);
    if (h) {
      if (h === 'car' && Math.abs(c.v) > 0.8 && S.cool <= 0) { S.crash++; S.cool = 1.5; pay(-CRASH); flash('쿵! 수리비 ' + won(-CRASH), '#ff5a5a'); }
      c.v = 0; return;
    }
    Object.assign(c, nx);
  }
  function pay(n) { S.money += n; setMoney(n); }
  function setMoney(n) {
    $('#money').textContent = won(S ? S.money : START);
    if (n < 0) { const w = $('#wallet'); w.classList.remove('hit'); void w.offsetWidth; w.classList.add('hit'); }
  }
  let flashT = 0;
  function flash(text, color = '#fff') { const f = $('#flash'); f.textContent = text; f.style.color = color; f.classList.remove('hidden'); flashT = 1.6; }

  // ─── 세우기: 볼일 보는 동안을 1분 단위로 시뮬레이션 ───
  function tryPark() {
    if (!S || !S.running || S.ff || Math.abs(S.car.v) > 0.3) return;
    S.running = false;
    const { d, P, lv } = S, pose = { x: S.car.x, y: S.car.y, heading: S.car.heading }, stay = P.stay, t0 = S.clock;
    const j = J.judgePose(lv, pose, 'park', { minutes: stay, clockMin: t0 });
    const r = j.rule, bad = !j.legal, manner = j.legal && j.answer === 'manner';
    const ev = []; const seen = [];
    let ticket = null, report = null, cctv = null, spotted = null;
    const cams = (lv.props || []).filter(p => p.type === 'cctv' && dist(p, pose) <= p.r);
    // 언제부터 위반인가: 시간제 칸은 허용 시간이 끝난 뒤부터, 정차만 되는 곳은 5분 뒤부터
    const flex = j.key === 'flex_zone' && lv.zones.find(z => z.hours && J.inZone(z, pose));
    const from = !bad ? 0 : flex ? Math.max(0, flex.hours[1] - t0) : r.stop ? 5 : 0;
    for (let m = 0; m < stay; m += 0.5) {
      const illegalNow = bad && m >= from;
      const t = t0 + m, e = encAt(d, P, t);
      if ((illegalNow || manner) && ticket == null && dist(e, pose) <= ENC_R) { ticket = m; ev.push({ m, k: 'enc' }); }
      P.watchers.forEach((w, wi) => { if (sees(w, t, pose)) { seen.push(m); if (spotted == null) { spotted = m; ev.push({ m, k: 'look', wi }); } } });
      if (illegalNow && r.report && report == null && seen.filter(x => x >= from).length && m - seen.find(x => x >= from) >= 1 && seen.some(x => x === m)) { report = m; ev.push({ m, k: 'photo' }); }
      if (illegalNow && r.fine && cams.length && cctv == null && m - from >= r.cctvGrace) { cctv = m; ev.push({ m, k: 'cctv' }); }
    }
    const caught = bad && ((ticket != null) || report != null || cctv != null);
    const fined = caught && r.fine > 0;
    const notice = bad && !r.fine && (ticket != null || (spotted != null && spotted >= from));
    const firstCatch = Math.min(...[ticket, report, cctv].filter(x => x != null), Infinity);
    const tow = caught && r.tow >= 0.5 && stay >= 30 && firstCatch + 10 <= stay ? firstCatch + 10 : null;
    if (tow != null) ev.push({ m: tow, k: 'tow' });
    const sticker = manner && (ticket != null || spotted != null);
    S.ff = { t: 0, dur: 2.5 + stay / 60 * 2.5, pose, j, t0, stay, ev, from, res: { bad, manner, ticket, report, cctv, fined, notice, tow, sticker, spotted } };
  }
  function settle() {
    const { j, res, stay } = S.ff, d = S.d, r = j.rule;
    const late = S.left < 0, lines = [];
    lines.push(late ? ['약속에 늦음 (커피 사기)', -LATE] : ['약속 시간 지킴 보너스', ON_TIME]);
    if (res.fined) lines.push([`과태료 — ${res.report != null ? '주민이 1분 간격으로 두 번 찍어 신고' : res.cctv != null ? 'CCTV에 찍힘' : d.guard + '이 딱지'}`, -r.fine]);
    if (res.notice) lines.push([res.ticket != null ? `${d.guard} 경고 스티커 + 이동 호출` : '주민이 관리실에 연락', -NOTICE]);
    if (res.tow != null) lines.push(['견인료 + 보관료', -TOW]);
    if (res.sticker) lines.push(['앞유리에 항의 쪽지 (세차)', -STICKER]);
    if (res.bad && S.ff.from > 0) lines.push([`${Math.round(S.ff.from)}분까지는 괜찮았지만 그 뒤로는 위반`, 0]);
    if (res.bad && !res.fined && !res.notice) lines.push(['아무도 못 봤어요 — 운이 좋았네요', 0]);
    if (res.manner && !res.sticker) lines.push(['눈총은 받았지만 무사', 0]);
    lines.forEach(l => S.money += l[1]);
    setMoney(lines.reduce((a, l) => a + l[1], 0));
    const tone = res.bad ? '#c0262d' : res.manner ? '#6b3fb8' : '#1f7a48';
    S.log.push({ where: r.short, bad: res.bad, manner: res.manner, sum: lines.reduce((a, l) => a + l[1], 0) - S.crash * CRASH });
    const last = S.i === DAY.length - 1, broke = S.money < 0;
    card(`<h2>${d.who} 정산</h2><p>세운 곳: <b style="color:${tone}">${r.name}${res.bad ? ' (위반)' : res.manner ? ' (비매너)' : ''}</b> · ${stay}분</p>
      <div class="lines">${S.crash ? `<div><span>운전 중 접촉 사고 ${S.crash}번 (이미 냄)</span><span class="minus">${won(-S.crash * CRASH)}</span></div>` : ''}${lines.map(([t, n]) => `<div><span>${t}</span><span class="${n < 0 ? 'minus' : n > 0 ? 'plus' : ''}">${n ? (n > 0 ? '+' : '') + won(n) : '—'}</span></div>`).join('')}</div>
      <p class="why">${r.easy || r.desc}</p>
      <p>지갑: <b class="big">${won(S.money)}</b></p>`,
      broke ? '파산… 결과 보기' : last ? '하루 마감' : '다음 장소로', () => (broke || last ? endDay(broke) : place(S.i + 1)));
  }
  function endDay(broke) {
    const m = S.money, best = store.get('pg-day-best', null), isBest = !broke && (best == null || m > best);
    if (isBest) store.set('pg-day-best', m);
    const rank = broke ? '파산' : m >= 90000 ? '주차의 신' : m >= 70000 ? '주차 고수' : m >= 50000 ? '무난한 하루' : m >= 25000 ? '지갑이 얇아짐' : '거의 털림';
    card(`<h2>${rank}${isBest ? ' · 최고 기록!' : ''}</h2><p>남은 돈 <b class="big">${won(m)}</b> <span class="why">(시작 ${won(START)}${best != null && !isBest ? ` · 최고 ${won(best)}` : ''})</span></p>
      <div class="lines">${S.log.map((l, i) => `<div><span>${DAY[i].who} — ${l.where}${l.bad ? ' · 위반' : l.manner ? ' · 비매너' : ''}</span><span class="${l.sum < 0 ? 'minus' : 'plus'}">${(l.sum > 0 ? '+' : '') + won(l.sum)}</span></div>`).join('')}</div>
      <p class="why">다시 하면 빈자리·주민·머무는 시간이 바뀝니다.</p>`, '한 번 더', startDay);
  }

  // ─── 그리기 ───
  function camera(w, h) {
    const ppm = Math.max(w / 44, h / 24), c = S.car, lv = S.lv;
    let cx = c.x + Math.cos(c.heading) * c.v * 0.6, cy = c.y + Math.sin(c.heading) * c.v * 0.6;
    const hw = w / 2 / ppm, hh = h / 2 / ppm;
    cx = lv.world.w < 2 * hw ? lv.world.w / 2 : clamp(cx, hw, lv.world.w - hw);
    cy = lv.world.h < 2 * hh ? lv.world.h / 2 : clamp(cy, hh, lv.world.h - hh);
    return { cx, cy, ppm, w, h };
  }
  function drawAgents(cam, dpr, t, showRoute) {
    const { d, P } = S, k = cam.ppm;
    const W = (x, y) => [(x - cam.cx) * k + cam.w / 2, (y - cam.cy) * k + cam.h / 2];
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (showRoute) { // 순찰길
      const [a, b] = d.patrol.map(p => W(p[0], p[1]));
      ctx.strokeStyle = 'rgba(255,210,58,.25)'; ctx.lineWidth = 3; ctx.setLineDash([6, 8]);
      ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke(); ctx.setLineDash([]);
    }
    (S.lv.props || []).filter(p => p.type === 'cctv').forEach(p => { const [x, y] = W(p.x, p.y); ctx.strokeStyle = 'rgba(255,90,90,.35)'; ctx.lineWidth = 2; ctx.setLineDash([4, 6]); ctx.beginPath(); ctx.arc(x, y, p.r * k, 0, 2 * PI); ctx.stroke(); ctx.setLineDash([]); });
    P.watchers.forEach(w => { // 주민 + 시야
      const [x, y] = W(w.x, w.y), a = watchAng(w, t);
      ctx.fillStyle = 'rgba(255,150,40,.20)'; ctx.beginPath(); ctx.moveTo(x, y); ctx.arc(x, y, SEE_R * k, a - SEE_HALF, a + SEE_HALF); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ff9a2a'; ctx.beginPath(); ctx.arc(x, y, Math.max(6, 0.5 * k), 0, 2 * PI); ctx.fill();
      ctx.fillStyle = '#2b2118'; ctx.beginPath(); ctx.arc(x, y, Math.max(3, 0.25 * k), 0, 2 * PI); ctx.fill();
    });
    const e = encAt(d, P, t), [ex, ey] = W(e.x, e.y); // 단속원
    ctx.fillStyle = 'rgba(255,210,58,.15)'; ctx.beginPath(); ctx.arc(ex, ey, ENC_R * k, 0, 2 * PI); ctx.fill();
    ctx.fillStyle = '#ffd23a'; ctx.beginPath(); ctx.arc(ex, ey, Math.max(7, 0.55 * k), 0, 2 * PI); ctx.fill();
    ctx.fillStyle = '#17202a'; ctx.font = `${Math.max(10, 0.5 * k)}px "Do Hyeon", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('단속', ex, ey);
    if (ex < 0 || ex > cam.w || ey < 0 || ey > cam.h) { // 화면 밖이면 가장자리 화살표
      const cx = clamp(ex, 70, cam.w - 70), cy = clamp(ey, 90, cam.h - 30);
      ctx.fillStyle = 'rgba(255,210,58,.9)'; ctx.font = '15px "Do Hyeon", sans-serif';
      ctx.fillText(`단속 ${ex < 0 ? '◀' : ex > cam.w ? '▶' : ey < 0 ? '▲' : '▼'} ${Math.round(Math.hypot(e.x - S.car.x, e.y - S.car.y))}m`, cx, cy);
    }
  }
  function drawFF(cam, dpr, ff) {
    const k = ff.t / ff.dur, m = ff.stay * k, lv = S.lv;
    const W = (x, y) => [(x - cam.cx) * cam.ppm + cam.w / 2, (y - cam.cy) * cam.ppm + cam.h / 2];
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.font = '24px "Do Hyeon", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    const [px, py] = W(ff.pose.x, ff.pose.y);
    ff.ev.filter(e => m >= e.m && m < e.m + Math.max(3, ff.stay * 0.12)).forEach(e => {
      if (e.k === 'enc') { ctx.fillStyle = '#ffd23a'; ctx.fillText(ff.res.bad || ff.res.manner ? '단속원: 어? 이 차…' : '', px, py - 34); }
      if (e.k === 'look') { const w = S.P.watchers[e.wi], [x, y] = W(w.x, w.y); ctx.fillStyle = '#ff9a2a'; ctx.fillText('👀', x, y - 18); }
      if (e.k === 'photo') { ctx.fillStyle = '#fff'; ctx.fillText('📸 찰칵 · 찰칵', px, py - 56); }
      if (e.k === 'cctv') { ctx.fillStyle = '#ff5a5a'; ctx.fillText('● CCTV 촬영', px, py + 44); }
      if (e.k === 'tow') { ctx.fillStyle = '#ffd23a'; ctx.fillText('🚚 견인차 도착', px, py - 78); }
    });
    if (ff.res.tow != null && m >= ff.res.tow) S.car.x = ff.pose.x - (m - ff.res.tow) * 3;
    ctx.font = '40px "Do Hyeon", sans-serif'; ctx.fillStyle = '#fff';
    ctx.fillText(`${fmt(ff.t0 + m)}  볼일 보는 중… (${Math.round(m)}/${ff.stay}분)`, cam.w / 2, cam.h * 0.64);
  }

  let last = performance.now();
  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (flashT > 0) { flashT -= dt; if (flashT <= 0) $('#flash').classList.add('hidden'); }
    const { w, h, dpr } = R.sizeCanvas(cv);
    if (!S || !S.lv) { ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.fillStyle = '#2b3036'; ctx.fillRect(0, 0, w, h); return; }
    if (S.running) { for (let i = 0; i < 3; i++) step(dt / 3); S.cool -= dt; S.left -= dt; S.clock += dt * 0.5; }
    let t = S.clock;
    if (S.ff) { if (!S.done) { S.ff.t = Math.min(S.ff.dur, S.ff.t + dt); if (S.ff.t >= S.ff.dur) { S.done = true; setTimeout(settle, 400); } } t = S.ff.t0 + S.ff.stay * (S.ff.t / S.ff.dur); }
    const cam = camera(w, h);
    R.drawWorld(ctx, S.lv, cam, { dpr, learn: false, state: {}, parked: S.parked, player: { ...S.car, gear: S.car.v < -0.05 ? 'R' : 'D', brakeOn: false }, showDest: S.running, t: now / 1000 });
    drawAgents(cam, dpr, t, S.running);
    if (S.running && stick.on && stick.mag > 0.15) {
      const sx = (S.car.x - cam.cx) * cam.ppm + cam.w / 2, sy = (S.car.y - cam.cy) * cam.ppm + cam.h / 2, L = 40 + 60 * stick.mag;
      ctx.strokeStyle = stick.rev ? 'rgba(255,90,90,.85)' : 'rgba(255,255,255,.8)'; ctx.lineWidth = 4; ctx.setLineDash([8, 6]);
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + Math.cos(stick.ang) * L, sy + Math.sin(stick.ang) * L); ctx.stroke(); ctx.setLineDash([]);
      if (stick.rev) { ctx.font = '18px "Do Hyeon", sans-serif'; ctx.fillStyle = '#ff8080'; ctx.textAlign = 'center'; ctx.fillText('후진', sx, sy - 26); }
    }
    if (S.ff) drawFF(cam, dpr, S.ff);
    const tt = Math.ceil(Math.abs(S.left));
    $('#timer').textContent = (S.left < 0 ? '+' : '') + `${Math.floor(tt / 60)}:${String(tt % 60).padStart(2, '0')}`;
    $('#timer').classList.toggle('late', S.left < 0);
    $('#parkBtn').disabled = !S.running || Math.abs(S.car.v) > 0.3;
  }
  requestAnimationFrame(loop);
  title();
  window.__spike = { get S() { return S; }, tryPark, keys, stick, DAY, place };
})();
</script>
