services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8000/api
    volumes:
      - ./frontend:/app
  hermes:
    build:
      context: .
      dockerfile: hermes/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      - HERMES_IVDR_API_URL=http://backend:8000/api
    depends_on:
      - backend
    restart: unless-stopped
